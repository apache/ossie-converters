# Input columns are order_month, region, customer_id, and amount.
rows:
  - ["2025-01", North, 1, 100]
  - ["2025-01", North, 1, 50]
  - ["2025-01", South, 2, 75]
  - ["2025-01", South, null, 25]
  - ["2025-02", North, 1, 25]
  - ["2025-02", North, 3, 55]
  - ["2025-02", South, 2, 80]
  - ["2025-02", South, 4, null]
  - ["2025-02", null, 5, 40]
  - ["2025-03", North, 6, null]

# Each expected row contains the grain columns, then revenue, distinct customers,
# and revenue per customer. The totals deliberately span repeated customers.
cases:
  - name: grand-total
    grain: []
    expected:
      - [450, 6, 75]
  - name: by-month
    grain: [order_month]
    expected:
      - ["2025-01", 250, 2, 125]
      - ["2025-02", 200, 5, 40]
      - ["2025-03", null, 1, null]
  - name: by-region
    grain: [region]
    expected:
      - [North, 230, 3, 76.66666667]
      - [South, 180, 2, 90]
      - [null, 40, 1, 40]
  - name: by-month-and-region
    grain: [order_month, region]
    expected:
      - ["2025-01", North, 150, 1, 150]
      - ["2025-01", South, 100, 1, 100]
      - ["2025-02", North, 80, 2, 40]
      - ["2025-02", South, 80, 2, 40]
      - ["2025-02", null, 40, 1, 40]
      - ["2025-03", North, null, 1, null]
  - name: filtered-total
    grain: []
    filters: {order_month: "2025-02", region: North}
    expected:
      - [80, 2, 40]
  - name: by-month-filtered-region
    grain: [order_month]
    filters: {region: North}
    expected:
      - ["2025-01", 150, 1, 150]
      - ["2025-02", 80, 2, 40]
      - ["2025-03", null, 1, null]
  - name: by-region-filtered-month
    grain: [region]
    filters: {order_month: "2025-02"}
    expected:
      - [North, 80, 2, 40]
      - [South, 80, 2, 40]
      - [null, 40, 1, 40]
