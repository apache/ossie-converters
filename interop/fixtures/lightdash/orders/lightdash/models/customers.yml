type: model
name: customers
sql_from: analytics.public.customers
primary_key: customer_id
dimensions:
  - name: customer_id
    type: number
    sql: ${TABLE}.customer_id
  - name: region
    type: string
    sql: ${TABLE}.region
  - name: signed_up_at
    type: date
    sql: ${TABLE}.signed_up_at
metrics:
  customer_count:
    type: count
    sql: ${TABLE}.customer_id
