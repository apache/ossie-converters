name: interop_snowflake_sales
description: A minimal Cortex Analyst fixture for the Ossie import path.
tables:
  - name: orders
    base_table:
      database: DEMO
      schema: PUBLIC
      table: ORDERS
    primary_key:
      columns: [ORDER_ID]
    dimensions:
      - name: ORDER_ID
        expr: ORDER_ID
        data_type: NUMBER(38,0)
    time_dimensions:
      - name: ORDER_DATE
        expr: ORDER_DATE
        data_type: DATE
    facts:
      - name: AMOUNT
        expr: AMOUNT
        data_type: NUMBER
    metrics:
      - name: TOTAL_AMOUNT
        expr: SUM(AMOUNT)
        data_type: NUMBER
