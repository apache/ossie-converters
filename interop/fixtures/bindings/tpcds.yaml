version: 1
metrics:
  total_sales:
    - {function: sum, source: tpcds.public.store_sales, column: ss_ext_sales_price, grain: tpcds.public.store_sales}
  total_profit:
    - {function: sum, source: tpcds.public.store_sales, column: ss_net_profit, grain: tpcds.public.store_sales}
  sales_by_brand:
    - {function: sum, source: tpcds.public.store_sales, column: ss_ext_sales_price, grain: tpcds.public.store_sales}
  customer_lifetime_value:
    - {function: sum, source: tpcds.public.store_sales, column: ss_ext_sales_price, grain: tpcds.public.store_sales}
    - {function: count_distinct, source: tpcds.public.customer, column: c_customer_sk, grain: tpcds.public.customer}
  store_productivity:
    - {function: sum, source: tpcds.public.store_sales, column: ss_ext_sales_price, grain: tpcds.public.store_sales}
    - {function: sum, source: tpcds.public.store, column: s_number_employees, grain: tpcds.public.store}
