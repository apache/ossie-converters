version: 1
input_form: sql-with-conflicts
datasets:
  orders:
    source: analytics.public.orders
    fields:
      id: id
      amount: amount
      net_amount: amount * 0.9
  refunds:
    source: analytics.public.refunds
    fields:
      refund_id: refund_id
      refund_amount: amount
metrics:
  total_amount:
    dataset: orders
    sql: SUM(orders.amount)
