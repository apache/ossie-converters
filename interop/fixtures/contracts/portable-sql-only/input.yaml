version: 0.2.0.dev0
name: orders_model
datasets:
- name: refunds
  source: analytics.public.refunds
  primary_key:
  - refund_id
  fields:
  - name: refund_id
    datatype: Integer
    expression:
      sql: refund_id
  - name: refund_amount
    datatype: Decimal
    expression:
      sql: amount
- name: orders
  source: analytics.public.orders
  primary_key:
  - id
  fields:
  - name: id
    datatype: Integer
    expression:
      sql: id
  - name: amount
    datatype: Decimal
    expression:
      sql: amount
  - name: net_amount
    datatype: Decimal
    expression:
      sql: amount * 0.9
relationships:
- name: orders_to_refunds
  from: orders
  to: refunds
  from_columns:
  - id
  to_columns:
  - refund_id
metrics:
- name: total_amount
  expression:
    sql: SUM(orders.amount)
