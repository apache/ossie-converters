version: 0.2.0.dev0
name: orders_model
datasets:
- name: orders
  source: analytics.public.orders
  fields:
  - name: order_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_id
    datatype: Integer
  - name: external_order_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: external_order_id
    datatype: Integer
  - name: amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    datatype: Decimal
  primary_key:
  - order_id
  unique_keys:
  - - external_order_id
metrics:
- name: total_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(orders.amount)
