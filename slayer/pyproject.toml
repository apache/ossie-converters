[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project]
name = "apache-ossie-slayer"
version = "0.1.0.dev0"
description = "Apache Ossie round trip through SLayer's native store"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "SLayer"
]
dependencies = [
    "motley-slayer==2.0.0",
]

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie-converters/"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.0"
package = false
default-groups = [
    "dev"
]
