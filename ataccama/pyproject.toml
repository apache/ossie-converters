[project]
name = "ataccama-ossie"
version = "0.2.0.dev0"
description = "Importer from Ataccama ONE catalog metadata to the Ossie semantic model"
authors = [{name = "Ataccama", email = "support@ataccama.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-ossie>=0.2.0.dev0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.scripts]
ataccama-to-ossie = "ataccama_ossie.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23.0",
    "ruff>=0.11.5",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
]

# apache-ossie is not yet published to PyPI; resolve it from the in-repo
# package for now. Remove this block once apache-ossie is published to PyPI.
[tool.uv.sources]
apache-ossie = { path = "../ossie/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/ataccama_ossie/**/*"]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/ataccama_ossie"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W", "C4", "PIE", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
