[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-snapshot",
]

[project]
name = "apache-ossie-palantir"
version = "0.1.0"
description = "Palantir ontology → Apache Ossie converter"
authors = [{ name = "RelationalAI", email = "support@relational.ai" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "Ontology",
    "Palantir"
]
dependencies = [
    "apache-ossie-ontology",
]

# Opt-in extra, only needed to run the Palantir -> Ossie -> RelationalAI test in
# tests/test_relationalai.py. It installs the `relationalai` extra of
# apache-ossie-ontology: read ontology/README.md, "The `relationalai` extra",
# before installing it.
[project.optional-dependencies]
relationalai = [
    "apache-ossie-ontology[relationalai]",
]

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie-converters/"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_palantir"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
exclude = ["tests/snapshots", "build", "venv"]

[tool.uv]
required-version = ">=0.9.0"
default-groups = [
    "dev"
]

# apache-ossie-ontology is not published to PyPI; resolve it from the in-repo
# package. Remove this block once it is published.
[tool.uv.sources]
apache-ossie-ontology = { path = "../ontology", editable = true }
