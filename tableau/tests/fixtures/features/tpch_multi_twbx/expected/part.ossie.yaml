- name: revenue_per_customer
  expression:
    dialects:
    - dialect: TABLEAU
      expression: SUM([LINEITEM].[L_EXTENDEDPRICE] * (1 - [LINEITEM].[L_DISCOUNT]))
        / COUNTD([CUSTOMER].[C_CUSTKEY])
