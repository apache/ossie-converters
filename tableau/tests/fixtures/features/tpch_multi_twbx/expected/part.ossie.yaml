      expression: SUM((LINEITEM.L_EXTENDEDPRICE) * (1 - (LINEITEM.L_DISCOUNT))) /
        COUNT(DISTINCT (CUSTOMER.C_CUSTKEY))
  datatype: Float
  custom_extensions:
