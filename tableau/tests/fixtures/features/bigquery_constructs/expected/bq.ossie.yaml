version: 0.3.0.dev0
name: bq
description: Converted from Tableau datasource bq
datasets:
- name: events
  source: proj.ds.events_*
  ai_context:
    synonyms:
    - events_*
  fields:
  - name: a
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a
    dimension: {}
    datatype: Integer
  - name: b
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: b
    dimension: {}
    datatype: String
- name: q
  source: SELECT a FROM `proj.ds.t` WHERE d > @start_date
metrics:
- name: n
  expression:
    dialects:
    - dialect: TABLEAU
      expression: COUNTD([events].[a])
    - dialect: BIGQUERY
      expression: COUNT(DISTINCT (events.a))
  datatype: Integer
  nonportable_extensions:
  - vendor_name: TABLEAU
    data:
      names:
        _v: 1
        kind: field_names
        witness:
          name: n
          label: null
        data:
          local: Calculation_1
          caption: n
- name: x
  expression:
    dialects:
    - dialect: TABLEAU
      expression: SUM([events].[a])/ZN(SUM([events].[a]))
    - dialect: BIGQUERY
      expression: SUM((events.a)) / COALESCE(SUM((events.a)), 0)
  datatype: Float
  nonportable_extensions:
  - vendor_name: TABLEAU
    data:
      names:
        _v: 1
        kind: field_names
        witness:
          name: x
          label: null
        data:
          local: Calculation_2
          caption: x
nonportable_extensions:
- vendor_name: TABLEAU
  data:
    source_file: input.tds
    datasource: bq
    connection_classes:
    - bigquery
    connection:
      class: bigquery
      project: proj
      CATALOG: proj
      EXECCATALOG: proj
    unconverted_calculations: []
    root:
      name: bq
      caption: null
      formatted_name: null
      source_platform: null
