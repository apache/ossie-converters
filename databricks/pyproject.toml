[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.5",
]

[project]
name = "apache-ossie-databricks"
version = "0.3.0.dev0"
description = "Databricks Unity Catalog metric views <> Apache Ossie converter"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "Databricks",
]
# The same ranges as ossie/validation/validate.py, which the package loads at run time.
dependencies = [
    "jsonschema>=4.26.0",
    "PyYAML>=6.0.3",
    "sqlglot>=30.19.0,<31",
]

[project.scripts]
ossie-databricks = "ossie_databricks.cli:main"

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie-converters/"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_databricks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.0"
default-groups = [
    "dev"
]
