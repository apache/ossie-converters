# Dataset sources: a table name, and a query with a final semicolon.
version: 0.3.0.dev0
name: sources
datasets:
  - name: orders
    source: main.raw.orders
    fields:
      - name: order_id
        expression:
          sql: o_orderkey
  - name: customer_totals
    source: |
      SELECT o_custkey, SUM(o_totalprice) AS total
      FROM main.sales.orders
      GROUP BY o_custkey;
    fields:
      - name: customer_id
        expression:
          sql: o_custkey
    metrics:
      - name: total
        expression:
          sql: SUM(source.total)
