# A model written for Databricks first: most expressions have only a DATABRICKS entry.
# `amount` has `sql` and an equal OSSIE_SQL_2026 entry, `segment` has its portable form as a
# dialect entry, and `status` has only ANSI SQL. `big_orders` uses a Databricks-only function,
# and `deployed_revenue` evaluates a metric view measure.
version: 0.3.0.dev0
name: databricks_first
datasets:
  - name: orders
    source: main.raw.orders
    fields:
      - name: order_id
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: o_orderkey
      - name: customer_id
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: o_custkey
      - name: Order Date
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: to_date(o_orderdate)
      - name: order_week
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: date_trunc('week', `o_orderdate`)
      - name: amount
        expression:
          sql: o_totalprice
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: o_totalprice
            - dialect: DATABRICKS
              expression: o_totalprice
      - name: status
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: o_orderstatus
    metrics:
      - name: revenue
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: SUM(amount) FILTER (WHERE status <> 'X')
      - name: big_orders
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: count_if(amount > 100)
      - name: deployed_revenue
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: MEASURE(source.revenue)
  - name: customers
    source: main.raw.customers
    fields:
      - name: customer_id
        expression:
          dialects:
            - dialect: DATABRICKS
              expression: c_custkey
      - name: segment
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: UPPER(c_mktsegment)
            - dialect: DATABRICKS
              expression: upper(c_mktsegment)
relationships:
  - name: orders_to_customers
    from: orders
    to: customers
    from_columns: [customer_id]
    to_columns: [customer_id]
metrics:
  - name: revenue_per_customer
    expression:
      dialects:
        - dialect: DATABRICKS
          expression: MEASURE(orders.revenue) / COUNT(DISTINCT customers.customer_id)
