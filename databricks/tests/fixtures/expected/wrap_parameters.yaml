model:
  version: 0.3.0.dev0
  name: parameters
  datasets:
  - name: parameters
    source: main.sales.parameters
    fields:
    - name: order_currency
      expression:
        sql: order_currency
    - name: amount
      expression:
        sql: amount
    metrics:
    - name: local_revenue
      expression:
        sql: SUM(amount) FILTER(WHERE order_currency = 'USD')
        dialects:
        - dialect: DATABRICKS
          expression: MEASURE(source.local_revenue)
    - name: large_orders
      expression:
        sql: COUNT(1) FILTER(WHERE amount >= 100)
        dialects:
        - dialect: DATABRICKS
          expression: MEASURE(source.large_orders)
warnings:
- '[METRIC_VIEW_HAS_PARAMETERS] at metric_views[parameters]: portable expressions use the parameter defaults'
