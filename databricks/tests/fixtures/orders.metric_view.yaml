# Measures over dimensions, over a source column that a dimension exposes, over a source column
# that no dimension exposes, over another measure, and with a window.
version: 1.1
source: main.sales.orders
comment: Orders
dimensions:
  - name: order_date
    expr: o_orderdate
    display_name: Order date
    synonyms: [purchase date]
  - name: status
    expr: o_orderstatus
  - name: amount
    expr: o_totalprice
measures:
  - name: revenue
    expr: SUM(amount)
    comment: Sum of the order prices
  - name: open_revenue
    expr: SUM(o_totalprice) FILTER (WHERE status = 'O')
  - name: discount
    expr: SUM(o_discount)
  - name: big_orders
    expr: count_if(amount > 100)
  - name: revenue_per_order
    expr: MEASURE(revenue) / COUNT(1)
  - name: trailing_revenue
    expr: SUM(amount)
    window:
      - order: order_date
        range: trailing 7 day
