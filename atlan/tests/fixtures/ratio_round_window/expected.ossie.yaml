version: 0.2.0.dev0
name: ratio_round_window
description: ROUND ratio and a count from one query; its fixed date range is named in the instructions
  only
datasets:
- name: store_returns
  source: TPCDS.PUBLIC.STORE_RETURNS
  fields:
  - name: sr_return_reason
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: SR_RETURN_REASON
      - dialect: ANSI_SQL
        expression: SR_RETURN_REASON
  - name: sr_returned_date
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: SR_RETURNED_DATE
      - dialect: ANSI_SQL
        expression: SR_RETURNED_DATE
metrics:
- name: defective_return_pct_defective_pct
  expression:
    dialects:
    - dialect: OSSIE_SQL_2026
      expression: ROUND(COUNT(CASE WHEN store_returns.sr_return_reason = 'defective' THEN 1 END) * 100.0
        / NULLIF(COUNT(CASE WHEN store_returns.sr_return_reason IN ('defective', 'changed_mind') THEN
        1 END), 0), 1)
    - dialect: ANSI_SQL
      expression: ROUND(COUNT(CASE WHEN store_returns.sr_return_reason = 'defective' THEN 1 END) * 100.0
        / NULLIF(COUNT(CASE WHEN store_returns.sr_return_reason IN ('defective', 'changed_mind') THEN
        1 END), 0), 1)
  datatype: Integer
  description: 'Share of defective returns among classified returns, and the count of classified returns.
    This part: defective_pct = ROUND(COUNT(CASE WHEN STORE_RETURNS.SR_RETURN_REASON = ''defective'' THEN
    1 END) * 100.0 / NULLIF(COUNT(CASE WHEN STORE_RETURNS.SR_RETURN_REASON IN (''defective'', ''changed_mind'')
    THEN 1 END), 0), 1).'
  ai_context:
    instructions: 'Grain: aggregate over entire filtered date range. Counts: Store returns with a reason
      of ''defective'' or ''changed_mind''. Excludes: returns with other reasons are excluded from the
      denominator. Date range fixed in the source query, not applied by this metric: store_returns.sr_returned_date
      >= ''2026-04-01'' AND store_returns.sr_returned_date < ''2026-07-01''.'
  custom_extensions:
  - vendor_name: ATLAN
    data: '{"registry": {"id": "metric_synth_defective_return_pct", "definition_version": 1, "output_column":
      "defective_pct"}, "agent_context": {"grain": "aggregate over entire filtered date range", "population":
      "Store returns with a reason of ''defective'' or ''changed_mind''", "exclusions": ["returns with
      other reasons are excluded from the denominator"], "sql_dialect": "snowflake", "window": ["store_returns.sr_returned_date
      >= ''2026-04-01''", "store_returns.sr_returned_date < ''2026-07-01''"], "examples": [{"sql": "SELECT
      ROUND(COUNT(CASE WHEN SR_RETURN_REASON=''defective'' THEN 1 END)*100.0/ NULLIF(COUNT(CASE WHEN SR_RETURN_REASON
      IN (''defective'',''changed_mind'') THEN 1 END),0),1) AS defective_pct FROM TPCDS.PUBLIC.STORE_RETURNS
      WHERE SR_RETURNED_DATE >= ''2026-04-01'' AND SR_RETURNED_DATE < ''2026-07-01''"}], "trust": {"score":
      7.5}}}'
- name: defective_return_pct_classified_returns
  expression:
    dialects:
    - dialect: OSSIE_SQL_2026
      expression: COUNT(CASE WHEN store_returns.sr_return_reason IN ('defective', 'changed_mind') THEN
        1 END)
    - dialect: ANSI_SQL
      expression: COUNT(CASE WHEN store_returns.sr_return_reason IN ('defective', 'changed_mind') THEN
        1 END)
  datatype: Integer
  description: 'Share of defective returns among classified returns, and the count of classified returns.
    This part: classified_returns = COUNT(CASE WHEN STORE_RETURNS.SR_RETURN_REASON IN (''defective'',
    ''changed_mind'') THEN 1 END).'
  ai_context:
    instructions: 'Grain: aggregate over entire filtered date range. Counts: Store returns with a reason
      of ''defective'' or ''changed_mind''. Excludes: returns with other reasons are excluded from the
      denominator. Date range fixed in the source query, not applied by this metric: store_returns.sr_returned_date
      >= ''2026-04-01'' AND store_returns.sr_returned_date < ''2026-07-01''.'
  custom_extensions:
  - vendor_name: ATLAN
    data: '{"registry": {"id": "metric_synth_defective_return_pct", "definition_version": 1, "output_column":
      "classified_returns"}, "agent_context": {"grain": "aggregate over entire filtered date range", "population":
      "Store returns with a reason of ''defective'' or ''changed_mind''", "exclusions": ["returns with
      other reasons are excluded from the denominator"], "sql_dialect": "snowflake", "window": ["store_returns.sr_returned_date
      >= ''2026-04-01''", "store_returns.sr_returned_date < ''2026-07-01''"], "trust": {"score": 7.5}}}'
custom_extensions:
- vendor_name: ATLAN
  data: '{"registry": {"workspace_id": "workspace_synthetic_tpcds"}}'
