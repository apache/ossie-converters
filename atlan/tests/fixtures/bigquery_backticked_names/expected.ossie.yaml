version: 0.2.0.dev0
name: bigquery_backticked_names
description: 'BigQuery names: a path in one pair of backticks, a join target quoted per part'
datasets:
- name: store_sales
  source: '`tpcds`.`public`.`store_sales`'
  fields:
  - name: ss_customer_sk
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: ss_customer_sk
      - dialect: ANSI_SQL
        expression: ss_customer_sk
  - name: ss_quantity
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: ss_quantity
      - dialect: ANSI_SQL
        expression: ss_quantity
  - name: ss_net_paid
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: ss_net_paid
      - dialect: ANSI_SQL
        expression: ss_net_paid
- name: customer
  source: '`tpcds`.`public`.`customer`'
  primary_key:
  - c_customer_sk
  fields:
  - name: c_customer_sk
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: c_customer_sk
      - dialect: ANSI_SQL
        expression: c_customer_sk
  - name: birth_country
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: c_birth_country
      - dialect: ANSI_SQL
        expression: c_birth_country
    dimension:
      is_time: false
    datatype: String
    description: Customer birth country.
relationships:
- name: store_sales_to_customer
  from: store_sales
  to: customer
  from_columns:
  - ss_customer_sk
  to_columns:
  - c_customer_sk
metrics:
- name: paid_by_birth_country
  expression:
    dialects:
    - dialect: OSSIE_SQL_2026
      expression: SUM(CASE WHEN (store_sales.ss_quantity > 0) THEN store_sales.ss_net_paid END)
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN (store_sales.ss_quantity > 0) THEN store_sales.ss_net_paid END)
  datatype: Decimal
  description: Net paid on store sales, by customer birth country
  ai_context:
    instructions: 'Grain: sale. Counts: Store sales with a positive quantity. Unit: currency. Re-aggregation:
      sum.'
  custom_extensions:
  - vendor_name: ATLAN
    data: '{"registry": {"id": "metric_synth_paid_by_birth_country", "definition_version": 1}, "agent_context":
      {"grain": "sale", "population": "Store sales with a positive quantity", "unit": "currency", "reaggregation":
      "sum", "sql_dialect": "bigquery", "dimensions": ["customer.birth_country"], "relationships": ["store_sales_to_customer"]}}'
custom_extensions:
- vendor_name: ATLAN
  data: '{"registry": {"workspace_id": "workspace_synthetic_tpcds"}}'
