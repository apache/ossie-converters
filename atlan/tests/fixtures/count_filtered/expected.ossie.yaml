version: 0.2.0.dev0
name: count_filtered
description: a WHERE clause becomes CASE WHEN inside the aggregate
datasets:
- name: customer
  source: TPCDS.PUBLIC.CUSTOMER
  fields:
  - name: c_preferred_cust_flag
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: C_PREFERRED_CUST_FLAG
      - dialect: ANSI_SQL
        expression: C_PREFERRED_CUST_FLAG
metrics:
- name: preferred_customer_count
  expression:
    dialects:
    - dialect: OSSIE_SQL_2026
      expression: COUNT(CASE WHEN (customer.c_preferred_cust_flag = 'Y') THEN 1 END)
    - dialect: ANSI_SQL
      expression: COUNT(CASE WHEN (customer.c_preferred_cust_flag = 'Y') THEN 1 END)
  datatype: Integer
  description: Count of customers whose preferred flag is set
  ai_context:
    instructions: 'Grain: customer. Counts: Customers flagged as preferred.'
  custom_extensions:
  - vendor_name: ATLAN
    data: '{"registry": {"id": "metric_synth_preferred_customer_count", "definition_version": 1}, "agent_context":
      {"grain": "customer", "population": "Customers flagged as preferred", "sql_dialect": "snowflake"}}'
custom_extensions:
- vendor_name: ATLAN
  data: '{"registry": {"workspace_id": "workspace_synthetic_tpcds"}}'
