version: 0.2.0.dev0
name: max_timestamp
description: a non-additive aggregate (MAX) with a time field
datasets:
- name: store_sales
  source: TPCDS.PUBLIC.STORE_SALES
  fields:
  - name: ss_sold_timestamp
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: SS_SOLD_TIMESTAMP
      - dialect: ANSI_SQL
        expression: SS_SOLD_TIMESTAMP
metrics:
- name: last_store_sale_at
  expression:
    dialects:
    - dialect: OSSIE_SQL_2026
      expression: MAX(store_sales.ss_sold_timestamp)
    - dialect: ANSI_SQL
      expression: MAX(store_sales.ss_sold_timestamp)
  datatype: DateTime
  description: Timestamp of the most recent store sale
  ai_context:
    instructions: 'Grain: table-level. Counts: All store sales.'
  custom_extensions:
  - vendor_name: ATLAN
    data: '{"registry": {"id": "metric_synth_last_store_sale_at", "definition_version": 1}, "agent_context":
      {"grain": "table-level", "population": "All store sales", "sql_dialect": "snowflake"}}'
custom_extensions:
- vendor_name: ATLAN
  data: '{"registry": {"workspace_id": "workspace_synthetic_tpcds"}}'
