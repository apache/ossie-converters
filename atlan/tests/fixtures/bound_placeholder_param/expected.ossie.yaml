version: 0.2.0.dev0
name: bound_placeholder_param
description: a {{window_days}} placeholder bound to its declared default; a ROUND ratio
datasets:
- name: customer_survey
  source: TPCDS.PUBLIC.CUSTOMER_SURVEY
  fields:
  - name: answer_date
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: ANSWERED_AT
      - dialect: ANSI_SQL
        expression: ANSWERED_AT
    dimension:
      is_time: true
    datatype: Date
    description: When the survey was answered.
  - name: score
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: SCORE
      - dialect: ANSI_SQL
        expression: SCORE
  - name: channel
    expression:
      dialects:
      - dialect: OSSIE_SQL_2026
        expression: CHANNEL
      - dialect: ANSI_SQL
        expression: CHANNEL
metrics:
- name: csat
  expression:
    dialects:
    - dialect: OSSIE_SQL_2026
      expression: ROUND(COUNT(CASE WHEN (customer_survey.score IN ('good', 'bad')) AND (customer_survey.answer_date
        >= DATEADD(DAY, -30, CURRENT_TIMESTAMP())) AND (customer_survey.channel = 'store') THEN CASE WHEN
        customer_survey.score = 'good' THEN 1 END END) * 100.0 / NULLIF(COUNT(CASE WHEN (customer_survey.score
        IN ('good', 'bad')) AND (customer_survey.answer_date >= DATEADD(DAY, -30, CURRENT_TIMESTAMP()))
        AND (customer_survey.channel = 'store') THEN CASE WHEN customer_survey.score IN ('good', 'bad')
        THEN 1 END END), 0), 1)
    - dialect: ANSI_SQL
      expression: ROUND(COUNT(CASE WHEN (customer_survey.score IN ('good', 'bad')) AND (customer_survey.answer_date
        >= DATEADD(DAY, -30, CURRENT_TIMESTAMP())) AND (customer_survey.channel = 'store') THEN CASE WHEN
        customer_survey.score = 'good' THEN 1 END END) * 100.0 / NULLIF(COUNT(CASE WHEN (customer_survey.score
        IN ('good', 'bad')) AND (customer_survey.answer_date >= DATEADD(DAY, -30, CURRENT_TIMESTAMP()))
        AND (customer_survey.channel = 'store') THEN CASE WHEN customer_survey.score IN ('good', 'bad')
        THEN 1 END END), 0), 1)
  datatype: Decimal
  description: Share of good scores among all good or bad survey answers
  ai_context:
    instructions: 'Grain: TPCDS.PUBLIC.CUSTOMER_SURVEY.SURVEY_ID. Counts: Survey answers with a good or
      bad score. Unit: percent. Re-aggregation: none.'
    examples:
    - What is the CSAT for store surveys over the last 30 days?
  custom_extensions:
  - vendor_name: ATLAN
    data: '{"registry": {"id": "metric_synth_csat", "definition_version": 1}, "agent_context": {"grain":
      "TPCDS.PUBLIC.CUSTOMER_SURVEY.SURVEY_ID", "population": "Survey answers with a good or bad score",
      "unit": "percent", "reaggregation": "none", "sql_dialect": "snowflake", "dimensions": ["customer_survey.answer_date"],
      "parameters": [{"name": "window_days", "datatype": "integer", "default": 30}], "depends_on": ["csat_responses"],
      "examples": [{"question": "What is the CSAT for store surveys over the last 30 days?", "sql": "SELECT
      ROUND(COUNT(CASE WHEN SCORE = ''good'' THEN 1 END) * 100.0 / NULLIF(COUNT(*), 0), 1) FROM TPCDS.PUBLIC.CUSTOMER_SURVEY
      WHERE SCORE IN (''good'',''bad'') AND CHANNEL = ''store'' AND ANSWERED_AT >= DATEADD(day, -30, CURRENT_TIMESTAMP)"}]}}'
custom_extensions:
- vendor_name: ATLAN
  data: '{"registry": {"workspace_id": "workspace_synthetic_tpcds"}}'
