version: 0.2.0.dev0
name: count_rows
description: 'COUNT(*) on one table: the simplest metric'
datasets:
- name: store_sales
  source: TPCDS.PUBLIC.STORE_SALES
metrics:
- name: store_sales_count
  expression:
    dialects:
    - dialect: OSSIE_SQL_2026
      expression: COUNT(store_sales.*)
    - dialect: ANSI_SQL
      expression: COUNT(store_sales.*)
  datatype: Integer
  description: Count all rows in the store sales fact table
  ai_context:
    instructions: 'Grain: table-level. Counts: All rows in TPCDS.PUBLIC.STORE_SALES.'
  custom_extensions:
  - vendor_name: ATLAN
    data: '{"registry": {"id": "metric_synth_store_sales_count", "definition_version": 1}, "agent_context":
      {"grain": "table-level", "population": "All rows in TPCDS.PUBLIC.STORE_SALES", "sql_dialect": "snowflake"}}'
custom_extensions:
- vendor_name: ATLAN
  data: '{"registry": {"workspace_id": "workspace_synthetic_tpcds"}}'
