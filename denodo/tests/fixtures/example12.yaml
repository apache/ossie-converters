version: 0.2.0.dev0
name: sales_view_diff_database
description: Example of metric view
datasets:
- name: nation
  source: vdb_tpch.psql_tpch_nation
  fields:
  - name: nation_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nation.n_name
  custom_extensions:
  - vendor_name: DENODO
    data: '{"fields_dimension":{"nation_name": "dim_nation"}}'
- name: orders
  source: vdb_tpch.psql_tpch_orders
  fields:
  - name: order_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: orders.o_orderdate
- name: region
  source: vdb_tpch.psql_tpch_region
- name: customer
  source: vdb_tpch.psql_tpch_customer
  fields:
  - name: customer_address_full
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: concat(customer.c_address, '-', nation.n_name)
  - name: customer_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer.c_name
  - name: customer_address
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer.c_address
  - name: customer_comment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer.c_comment
  custom_extensions:
  - vendor_name: DENODO
    data: '{"fields_dimension":{"customer_address_full": "dim_customer", "customer_name":"dim_customer"}}'
relationships:
- name: vdb_tpch.psql_tpch_nation_psql_tpch_customer
  from: customer
  to: nation
  from_columns: [n_nationkey]
  to_columns: [c_nationkey]
  custom_extensions:
  - vendor_name: DENODO
    data: '{"isReferentialConstraint": false, "from_columns": {"relation": "1"}}'
- name: vdb_tpch.psql_tpch_region_psql_tpch_nation
  from: nation
  to: region
  from_columns: [r_regionkey]
  to_columns: [n_regionkey]
- name: vdb_tpch.psql_tpch_customer_psql_tpch_orders
  from: orders
  to: customer
  from_columns: [c_custkey]
  to_columns: [o_custkey]
  custom_extensions:
  - vendor_name: DENODO
    data: '{"to_columns": {"relation": "0,1"}}'
metrics:
- name: count_order_keys
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: count(orders.o_orderkey)
- name: order_average_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: avg(orders.o_totalprice)
