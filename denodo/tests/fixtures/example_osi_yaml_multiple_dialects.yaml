version: 0.2.0.dev0
name: ecommerce_analytics
description: E-commerce sales and customer analytics
ai_context:
  instructions: Use this model for analyzing sales trends, customer behavior, and
    product performance
datasets:
- name: orders
  source: sales.orders
  primary_key: [order_id]
  description: Customer orders
  fields:
  - name: order_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_id
    description: Order identifier
  - name: customer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer_id
    description: Customer identifier
  - name: order_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_date
    datatype: Date
    dimension:
      is_time: true
    description: Order date
  - name: order_date_year
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: year(order_date)
      - dialect: DATABRICKS
        expression: years(order_date)
    datatype: Date
    dimension:
      is_time: true
    description: Order date
  - name: amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    description: Order amount
  custom_extensions:
  - vendor_name: DENODO
    data: '{"fields_dimension":{"order_id": "orders_dim","customer_id": "orders_dim","order_date":
      "orders_dim","order_date_year": "orders_dim","amount": "orders_dim"}}'
- name: customers
  source: sales.customers
  primary_key: [id]
  description: Customer information
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: Customer identifier
  - name: customer_full_name
    expression:
      dialects:
      - dialect: DATABRICKS
        expression: concat(customer_lastname,",",customer_name)
      - dialect: ANSI_SQL
        expression: customer_lastname || ","|| customer_name
    description: Customer full name
  - name: email
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: email
    description: Customer email
  custom_extensions:
  - vendor_name: DENODO
    data: '{"fields_dimension":{"id": "customers_dim","customer_full_name": "customers_dim","email":
      "customers_dim"}}'
relationships:
- name: orders_to_customers
  from: orders
  to: customers
  from_columns: [customer_id]
  to_columns: [id]
metrics:
- name: total_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(orders.amount)
  description: Total revenue from all orders
  ai_context:
    synonyms:
    - total sales
    - revenue
- name: customer_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT customers.id)
  description: Total number of customers
  ai_context:
    synonyms:
    - total customers
    - customer base
custom_extensions:
- vendor_name: SNOWFLAKE
  data: '{"warehouse": "ANALYTICS_WH"}'
