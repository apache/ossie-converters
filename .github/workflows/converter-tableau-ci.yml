name: Converters Tableau CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'tableau/**'
      - 'ossie'
      - '.github/workflows/converter-tableau-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'tableau/**'
      - 'ossie'
      - '.github/workflows/converter-tableau-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"

      - name: Sync dependencies
        working-directory: tableau
        run: |
          uv sync

      - name: Lint
        working-directory: tableau
        run: |
          uv run ruff check src tests

      - name: Unit Tests
        working-directory: tableau
        run: |
          uv run pytest

      - name: CLI round trip (to-tds, convert, validate)
        working-directory: tableau
        run: |
          uv run ossie-tableau to-tds ../ossie/examples/tpcds_semantic_model.yaml -o /tmp/rt --server example.snowflakecomputing.com --database TPCDS
          uv run ossie-tableau convert /tmp/rt/tpcds_semantic_model.tds -o /tmp/rt/back --no-clobber -q
          test -s /tmp/rt/back/manifest.json
          uv run --script ../ossie/validation/validate.py /tmp/rt/back/*.ossie.yaml
