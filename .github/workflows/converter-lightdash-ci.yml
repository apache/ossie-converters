name: Converters Lightdash CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'lightdash/**'
      - 'ossie'
      - '.github/workflows/converter-lightdash-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'lightdash/**'
      - 'ossie'
      - '.github/workflows/converter-lightdash-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the Lightdash CLI
        # The tests that run `lightdash compile` over the exported project skip
        # without the CLI. It needs no Lightdash server or warehouse
        # credentials for a compile-only run.
        run: |
          npm install --no-package-lock --prefix "$RUNNER_TEMP/lightdash" @lightdash/cli@2.629.4
          echo "$RUNNER_TEMP/lightdash/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        working-directory: lightdash
        run: |
          uv sync --locked

      - name: Unit Tests
        working-directory: lightdash
        run: |
          uv run pytest
