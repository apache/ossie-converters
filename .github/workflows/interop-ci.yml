name: Interop matrix

on:
  push:
    branches: [main]
    paths:
      - 'interop/**'
      - 'ossie'
      - '.gitmodules'
      - '.github/workflows/interop-ci.yml'
      - 'cube/**'
      - 'dbt/**'
      - 'gooddata/**'
      - 'hex/**'
      - 'holistics/**'
      - 'honeydew/**'
      - 'microsoft/**'
      - 'nvidia/**'
      - 'omni/**'
      - 'ontology/**'
      - 'orionbelt/**'
      - 'sigma/**'
      - 'snowflake/**'
      - 'thoughtspot/**'
      - 'wisdom/**'
      - 'wisdom-semantic-view/**'
      - 'databricks/**'
      - 'polaris/**'
      - 'salesforce/**'
  pull_request:
    branches: [main]
    paths:
      - 'interop/**'
      - 'ossie'
      - '.gitmodules'
      - '.github/workflows/interop-ci.yml'
      - 'cube/**'
      - 'dbt/**'
      - 'gooddata/**'
      - 'hex/**'
      - 'holistics/**'
      - 'honeydew/**'
      - 'microsoft/**'
      - 'nvidia/**'
      - 'omni/**'
      - 'ontology/**'
      - 'orionbelt/**'
      - 'sigma/**'
      - 'snowflake/**'
      - 'thoughtspot/**'
      - 'wisdom/**'
      - 'wisdom-semantic-view/**'
      - 'databricks/**'
      - 'polaris/**'
      - 'salesforce/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: '3.12'

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            databricks/java/pom.xml
            salesforce/pom.xml

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install harness dependencies
        run: uv sync --project interop --locked

      - name: Test the harness
        run: uv run --project interop --locked pytest interop/tests -q

      - name: Run report-only matrix
        id: matrix
        # Default mode preserves converter FAIL/EMPTY/SKIP as findings. Harness
        # errors still fail this step; do not add --strict or continue-on-error.
        run: uv run --project interop --locked python -m interop --native --output interop/.runs/ci

      - name: Upload report and conversion evidence
        id: evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ github.run_id }}-${{ github.run_attempt }}
          path: interop/.runs/ci/
          # The run directory is deliberately hidden and Git-ignored. Upload
          # only this run, including any hidden native files, never environments.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Publish Actions summary
        if: ${{ always() }}
        env:
          INTEROP_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: >-
          python -m interop.ci_summary interop/.runs/ci
          --summary "$GITHUB_STEP_SUMMARY"
          --artifact-url "$INTEROP_ARTIFACT_URL"
