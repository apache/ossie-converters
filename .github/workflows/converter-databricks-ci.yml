name: Converters Databricks CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'databricks/**'
      - 'ossie'
      - '.github/workflows/converter-databricks-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'databricks/**'
      - 'ossie'
      - '.github/workflows/converter-databricks-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"

      - name: Sync dependencies
        working-directory: databricks
        run: |
          uv sync

      - name: Lint
        working-directory: databricks
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Unit Tests
        working-directory: databricks
        run: |
          uv run pytest

      - name: Smoke-test installed wheel
        working-directory: databricks
        run: |
          uv build --out-dir "$RUNNER_TEMP/databricks-dist"
          uv venv "$RUNNER_TEMP/databricks-wheel"
          uv pip install --python "$RUNNER_TEMP/databricks-wheel/bin/python" "$RUNNER_TEMP"/databricks-dist/*.whl
          cd "$RUNNER_TEMP"
          env -u OSSIE_REPO databricks-wheel/bin/python -c "
          from ossie_databricks import wrap_metric_view_in_ossie_model
          result = wrap_metric_view_in_ossie_model(
              'main.sales.orders', {'version': '1.1', 'source': 'samples.tpch.orders'}
          )
          assert 'main.sales.orders' in result.value
          "
