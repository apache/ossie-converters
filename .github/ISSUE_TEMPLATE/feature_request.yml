name: Feature request
description: Suggest an improvement to an existing converter or to the repository.
labels: [enhancement]
body:
  # The Converter options must match the converter/* labels in .github/labeler.yml;
  # auto-label-issues.yml applies converter/<option> and dev/check-issue-templates
  # keeps the two in sync.
  - type: dropdown
    id: converter
    attributes:
      label: Converter
      description: Which converter(s) does this affect? Select all that apply.
      multiple: true
      options:
        - cube
        - databricks
        - dbt
        - gooddata
        - hex
        - holistics
        - honeydew
        - microsoft
        - nvidia
        - omni
        - ontology
        - orionbelt
        - polaris
        - salesforce
        - sigma
        - snowflake
        - thoughtspot
        - wisdom
        - wisdom-semantic-view
        - N/A
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What can't you do today, or what is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
