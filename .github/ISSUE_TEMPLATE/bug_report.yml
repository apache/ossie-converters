name: Bug report
description: A converter produces wrong output, fails, or drops information.
labels: [bug]
body:
  # The Converter options must match the converter/* labels in .github/labeler.yml;
  # auto-label-issues.yml applies converter/<option> and dev/check-issue-templates
  # keeps the two in sync.
  - type: dropdown
    id: converter
    attributes:
      label: Converter
      description: Which converter(s) does this affect? Select all that apply.
      multiple: true
      options:
        - cube
        - databricks
        - dbt
        - gooddata
        - hex
        - holistics
        - honeydew
        - microsoft
        - nvidia
        - omni
        - ontology
        - orionbelt
        - polaris
        - salesforce
        - sigma
        - snowflake
        - thoughtspot
        - wisdom
        - wisdom-semantic-view
        - N/A
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release or commit SHA of ossie-converters you are using.
      placeholder: e.g. bc4eb5d
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug, including any error output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command or code you ran and the input it ran on.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: input
    attributes:
      label: Input snippet
      description: A minimal Ossie or vendor model that reproduces the bug, if you can share one.
      render: yaml
