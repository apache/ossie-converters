name: New converter
description: Propose or request a converter for a platform that does not have one yet.
labels: [new-converter]
body:
  # auto-label-issues.yml recognizes this form by its "Platform" heading and applies
  # new-converter itself, since GitHub drops form labels that do not exist yet.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The tool or format the converter would target.
      placeholder: e.g. Lightdash, Apache Superset
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Documentation
      description: A link to the platform's semantic model documentation.
  - type: dropdown
    id: direction
    attributes:
      label: Direction
      options:
        - Import to Ossie
        - Export from Ossie
        - Both
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: How does the platform represent its semantic model, and how would it map to Ossie?
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to contribute this converter.
