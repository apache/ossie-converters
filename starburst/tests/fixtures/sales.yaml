apiVersion: v1
kind: SemanticModel
catalogs:
  - name: commerce
    summary: Commerce catalog
    schemas:
      - name: sales
        tables:
          - name: orders
            description: Published orders
            columns:
              - name: net_amount
                synonyms: [net sales]
        views:
          - name: buyers
            columns:
              - name: buyer_key
                description: Stable buyer identifier
joins:
  - name: buyers_to_orders
    description: Orders matched to buyers in the same tenant
    from: [commerce.sales.buyers.buyer_key, commerce.sales.buyers.tenant_key]
    to: [commerce.sales.orders.buyer_key, commerce.sales.orders.tenant_key]
    cardinality: ONE_TO_MANY
semantics:
  domain: Commerce Sales
  terms:
    - name: buyer
      summary: Person or organization placing an order
      relationships:
        - type: REFERS
          tables: [commerce.sales.buyers]
  metrics:
    - name: total_sales
      label: Total sales
      table: commerce.sales.orders
      sql: SUM(net_amount)
  dimensions:
    - name: sale_month
      table: commerce.sales.orders
      sql: DATE_TRUNC('MONTH', sold_at)
