# SAP Business Partner slice — expected ontology for sap-bp-slice.csn.json.
# Validates against ontology/ontology.json (v0.2.0.dev0) from the pinned ossie submodule.
# Scope: one Business-Partner-class entity family, compound identity, associations,
#        DDIC domain machinery, and one mapping to a data-product-shaped dataset.
# Deliberately out of scope (v1): actions/events (behavior-layer proposal is the join point),
#        hierarchies, time-dependence, authorization semantics.

version: "0.2.0.dev0"
name: sap_business_partner
description: >
  An ontology-layer model of the SAP Business Partner domain, covering business
  partners, the customer role derived from them, and the customer master data maintained
  per sales area.

ontology:

  # ---- Value types carrying DDIC domain semantics -------------------------

  - concept: BusinessPartnerNumber
    type: ValueType
    description: >
      Identifier of a business partner. Technical origin: DDIC domain BU_PARTNER (CHAR
      10, ALPHA conversion). The leading-zero conversion routine is a representation
      concern and is recorded here, not modeled.
    extends: [ String ]

  - concept: BusinessPartnerCategory
    type: ValueType
    description: >
      Category of a business partner. Technical origin: DDIC domain BU_TYPE with fixed
      values — 1 = person, 2 = organization, 3 = group. The fixed values become a
      requires constraint over a closed set.
    extends: [ String ]
    requires:
      - "BusinessPartnerCategory == '1' OR BusinessPartnerCategory == '2' OR BusinessPartnerCategory == '3'"

  - concept: CustomerNumber
    type: ValueType
    description: >
      Identifier of a business partner in its customer role. Technical origin: DDIC
      domain KUNNR (CHAR 10, ALPHA).
    extends: [ String ]

  - concept: CountryCode
    type: ValueType
    description: >
      Country key. Technical origin: DDIC domain LAND1 (CHAR 3); values are commonly ISO
      3166-1 alpha-2. The value is carried through from BUSINESS_PARTNER.COUNTRY. The
      check table T005 is noted here as provenance; it is not modeled as a dataset in
      this example.
    extends: [ String ]

  - concept: SalesOrganization
    type: ValueType
    description: "Sales organization. DDIC domain VKORG (CHAR 4, check table TVKO)."
    extends: [ String ]

  - concept: DistributionChannel
    type: ValueType
    description: "Distribution channel. DDIC domain VTWEG (CHAR 2, check table TVTW)."
    extends: [ String ]

  - concept: Division
    type: ValueType
    description: "Division. DDIC domain SPART (CHAR 2, check table TSPA)."
    extends: [ String ]

  - concept: PartnerName
    type: ValueType
    description: "Full name of the business partner (BUT000 name fields, concatenated business view)."
    extends: [ String ]

  # ---- Entity types -------------------------------------------------------

  - concept: BusinessPartner
    type: EntityType
    description: >
      A person, organization, or group with which the company has a business interest.
      Source entity: BusinessPartner (BUT000-class). Identity is simple: a single
      identifying relationship.
    identify_by: [ nr ]
    relationships:
      - name: nr
        description: "Preferred identifier (key element BusinessPartner)."
        roles:
          - concept: BusinessPartnerNumber
        multiplicity: OneToOne
        verbalizes:
          - "{BusinessPartner} is identified by {BusinessPartnerNumber}"
          - "{BusinessPartnerNumber} identifies {BusinessPartner}"
      - name: category
        description: "Element BusinessPartnerCategory (domain BU_TYPE)."
        roles:
          - concept: BusinessPartnerCategory
        multiplicity: ManyToOne
        verbalizes:
          - "{BusinessPartner} is of category {BusinessPartnerCategory}"
      - name: full_name
        description: "Element BusinessPartnerFullName; the source label is carried into the verbalization."
        roles:
          - concept: PartnerName
        multiplicity: ManyToOne
        verbalizes:
          - "{BusinessPartner} is named {PartnerName}"
      - name: country
        description: >
          Element Country (domain LAND1, check table T005). Modeled as a relationship to
          the CountryCode value type, populated from BUSINESS_PARTNER.COUNTRY.
        roles:
          - concept: CountryCode
        multiplicity: ManyToOne
        verbalizes:
          - "{BusinessPartner} is based in country {CountryCode}"
      - name: customer_nr
        description: >
          Association _Customer (I_Customer / FLCU00-class role view). A business
          partner may hold the customer role; when it does, exactly one customer number
          applies.
        roles:
          - concept: CustomerNumber
        multiplicity: ManyToOne
        verbalizes:
          - "{BusinessPartner} acts as customer {CustomerNumber}"

  - concept: Customer
    type: EntityType
    description: >
      A business partner in its customer role. Source entity: Customer (I_Customer).
      Modeled as a derived subtype: rather than asserting its population, `derived_by`
      defines it as exactly those business partners that carry a customer number. This
      is how SAP's role concept reads under a closed-world assumption. The identifier
      `nr` is inherited from BusinessPartner and declared explicitly in `identify_by`.
    extends: [ BusinessPartner ]
    identify_by: [ nr ]
    derived_by:
      - "EXISTS ( BusinessPartner.customer_nr )"

  - concept: CustomerSalesArea
    type: EntityType
    description: >
      Customer master data per sales area. Source entity: CustomerSalesArea
      (KNVV-class), key = Customer + SalesOrganization + DistributionChannel + Division.
      The compound identifier is declared as four identifying relationships.
    identify_by: [ customer, sales_org, channel, division ]
    requires:
      - "CustomerSalesArea.customer"
      - "CustomerSalesArea.sales_org"
      - "CustomerSalesArea.channel"
      - "CustomerSalesArea.division"
    relationships:
      - name: customer
        description: >
          Association _Customer, and the reverse reading of the source's
          _SalesArea association: one relationship, verbalized in both
          directions. Functional from the sales area (each sales-area record
          belongs to exactly one customer); one customer sells through many
          sales areas.
        roles:
          - concept: Customer
        multiplicity: ManyToOne
        verbalizes:
          - "{CustomerSalesArea} belongs to {Customer}"
          - "{Customer} sells through {CustomerSalesArea}"
      - name: sales_org
        roles:
          - concept: SalesOrganization
        multiplicity: ManyToOne
        verbalizes:
          - "{CustomerSalesArea} is maintained in sales organization {SalesOrganization}"
      - name: channel
        roles:
          - concept: DistributionChannel
        multiplicity: ManyToOne
        verbalizes:
          - "{CustomerSalesArea} sells via distribution channel {DistributionChannel}"
      - name: division
        roles:
          - concept: Division
        multiplicity: ManyToOne
        verbalizes:
          - "{CustomerSalesArea} covers division {Division}"
      - name: delivery_blocked
        description: >
          Element DeliveryIsBlocked (domain LIFSD, CHAR 2: blank means not blocked, any
          other value is a block reason). Reduced here to a unary flag: a relationship
          with no roles and no multiplicity, it either holds of a CustomerSalesArea or
          it does not.
        verbalizes:
          - "{CustomerSalesArea} is blocked for delivery"

# ---- Mapping: data-product dataset → ontology ----------------------------
# The logical layer below is a minimal BDC-data-product-shaped semantic model;
# expressions use the OSI_SQL_2026 core subset.

ontology_mappings:

  - name: customer_sales_area_from_data_product
    description: >
      Populates the Business Partner slice from a customer-sales data product.
      The nested referent mapping under 'customer' is compound identity doing
      real work: a sales-area row references its customer, which is itself
      referenced by business partner number.
    semantic_model:
      version: "0.2.0.dev0"
      name: sap_customer_sales
      description: "Customer sales master data, projected from CDS views in the source system."
      datasets:
        - name: CUSTOMER_SALES_AREA
          source: "sales.customer_sales_area"
          primary_key: [ BUSINESS_PARTNER, SALES_ORG, DISTR_CHANNEL, DIVISION ]
          fields:
            - name: BUSINESS_PARTNER
              expression:
                dialects:
                  - dialect: ANSI_SQL
                    expression: "BUSINESS_PARTNER"
              datatype: String
            - name: SALES_ORG
              expression:
                dialects:
                  - dialect: ANSI_SQL
                    expression: "SALES_ORG"
              datatype: String
            - name: DISTR_CHANNEL
              expression:
                dialects:
                  - dialect: ANSI_SQL
                    expression: "DISTR_CHANNEL"
              datatype: String
            - name: DIVISION
              expression:
                dialects:
                  - dialect: ANSI_SQL
                    expression: "DIVISION"
              datatype: String
            - name: DELIVERY_BLOCK
              expression:
                dialects:
                  - dialect: ANSI_SQL
                    expression: "DELIVERY_BLOCK"
              datatype: String
        - name: BUSINESS_PARTNER
          source: "master_data.business_partner"
          primary_key: [ BP_NUMBER ]
          fields:
            - name: BP_NUMBER
              expression:
                dialects:
                  - dialect: ANSI_SQL
                    expression: "BP_NUMBER"
              datatype: String
            - name: BP_CATEGORY
              expression:
                dialects:
                  - dialect: ANSI_SQL
                    expression: "BP_CATEGORY"
              datatype: String
            - name: BP_FULL_NAME
              expression:
                dialects:
                  - dialect: ANSI_SQL
                    expression: "BP_FULL_NAME"
              datatype: String
            - name: COUNTRY
              expression:
                dialects:
                  - dialect: ANSI_SQL
                    expression: "COUNTRY"
              datatype: String
    concept_mappings:

      - concept: BusinessPartner
        object_mappings:
          - referent_mappings:
              - relationship: nr
                expression: "BUSINESS_PARTNER.BP_NUMBER"
        link_mappings:
          - object_mapping:
              referent_mappings:
                - relationship: nr
                  expression: "BUSINESS_PARTNER.BP_NUMBER"
            children:
              - relationship: category
                object_mapping:
                  expression: "BUSINESS_PARTNER.BP_CATEGORY"
              - relationship: full_name
                object_mapping:
                  expression: "BUSINESS_PARTNER.BP_FULL_NAME"
              - relationship: country
                object_mapping:
                  expression: "BUSINESS_PARTNER.COUNTRY"

      - concept: CustomerSalesArea
        object_mappings:
          - referent_mappings:
              - relationship: customer
                referent_mappings:
                  - relationship: BusinessPartner.nr
                    expression: "CUSTOMER_SALES_AREA.BUSINESS_PARTNER"
              - relationship: sales_org
                expression: "CUSTOMER_SALES_AREA.SALES_ORG"
              - relationship: channel
                expression: "CUSTOMER_SALES_AREA.DISTR_CHANNEL"
              - relationship: division
                expression: "CUSTOMER_SALES_AREA.DIVISION"
