[project]
name = "apache-ossie-sap-csn-ontology"
version = "0.2.0.dev0"
description = "SAP CSN (Core Schema Notation) -> Apache Ossie ontology converter"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "SAP",
    "CSN",
    "CAP",
    "ontology",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
ossie-sap-csn-ontology = "ossie_sap_csn_ontology.cli:main"

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie/"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.26.0",
    "referencing>=0.36.0",
    "ruff>=0.11.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_sap_csn_ontology"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W", "C4", "PIE", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.0"
default-groups = ["dev"]
