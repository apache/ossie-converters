        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: id
        datatype: Integer
      - name: orderNr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: orderNr
      - name: paymentDate
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: paymentDate
      - name: amount
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: amount
        datatype: Decimal
      - name: type
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: type
        datatype: String
      - name: cardNumber
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: cardNumber
        datatype: String
      - name: cardExpiry
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: cardExpiry
      - name: cardHolderName
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: cardHolderName
        datatype: String
      - name: cashReceived
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: cashReceived
        datatype: Decimal
    - name: RETAIL_FACTS
      source: DB.SCHEMA.RETAIL_FACTS
      fields:
      - name: item_nr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: item_nr
        datatype: Integer
      - name: store_nr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: store_nr
        datatype: Integer
      - name: week_nr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: week_nr
        datatype: Integer
      - name: sls
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: sls
        datatype: Decimal
      - name: returns
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: returns
        datatype: Decimal
  concept_mappings:
  - concept: Employee
    object_mappings:
    - referent_mappings:
      - relationship: nr
        expression: EMPLOYEES.empNr
    link_mappings:
    - object_mapping:
        referent_mappings:
        - relationship: nr
          expression: EMPLOYEES.empNr
      children:
      - relationship: reportsTo
        object_mapping:
          concept: Employee
          referent_mappings:
          - relationship: nr
            expression: EMPLOYEES.mgr
      - relationship: firstName
        object_mapping:
          concept: String
          expression: EMPLOYEES.firstName
      - relationship: lastName
        object_mapping:
          concept: String
          expression: EMPLOYEES.lastName
  - concept: Contractor
    object_mappings:
    - concept: Employee
      referent_mappings:
      - relationship: nr
        expression: CONTRACTORS.empNr
    link_mappings:
    - object_mapping:
        concept: Employee
        referent_mappings:
        - relationship: nr
          expression: CONTRACTORS.empNr
      children:
      - relationship: hourlyRate
        object_mapping:
          concept: Integer
          expression: CONTRACTORS.hourlyRate
  - concept: PermanentEmployee
    object_mappings:
    - concept: Employee
