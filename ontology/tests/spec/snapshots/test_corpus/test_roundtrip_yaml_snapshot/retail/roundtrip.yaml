      - name: hourlyRate
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: hourlyRate
        datatype: Integer
    - name: PERMANENT_EMPLOYEES
      source: DB.SCHEMA.PERMANENT_EMPLOYEES
      fields:
      - name: empNr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: empNr
        datatype: Integer
      - name: salary
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: salary
        datatype: Integer
    - name: LOCATIONS
      source: DB.SCHEMA.LOCATIONS
      fields:
      - name: storeNr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: storeNr
        datatype: Integer
      - name: mgr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: mgr
        datatype: Integer
      - name: region
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: region
        datatype: String
      - name: addr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: addr
      - name: city
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: city
      - name: state
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: state
      - name: zip
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: zip
    - name: PRODUCTS
      source: DB.SCHEMA.PRODUCTS
      fields:
      - name: upc
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: upc
        datatype: Integer
      - name: description
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: description
        datatype: String
      - name: classNr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: classNr
        datatype: Integer
      - name: classLabel
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: classLabel
        datatype: String
      - name: category
