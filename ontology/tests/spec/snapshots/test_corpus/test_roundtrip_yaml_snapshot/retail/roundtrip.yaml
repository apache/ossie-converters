version: 0.2.0.dev0
name: RETAIL_REFACTORED
description: Retail ontology with employees, stores, products, transactions, orders,
  payments, and weekly sales facts.
ontology:
- concept: Payment
  type: EntityType
  description: Order Payment.
  identify_by:
  - id
  relationships:
  - name: id
    roles:
    - concept: PaymentId
    multiplicity: OneToOne
    verbalizes:
    - '{Payment} is identified by {PaymentId}'
  - name: type
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Payment} has type {String}'
  - name: amount
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{Payment} has amount {Decimal}'
- concept: CashPayment
  type: EntityType
  description: Payment made in cash.
  extends:
  - Payment
  derived_by:
  - Payment.type == 'cash'
  relationships:
  - name: cashReceived
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{CashPayment} has cash received {Decimal}'
  - name: change
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{CashPayment} has change {Decimal}'
- concept: CardPayment
  type: EntityType
  description: Payment made by card.
  extends:
  - Payment
  derived_by:
  - Payment.type == 'card'
  relationships:
  - name: cardNumber
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{CardPayment} has card number {String}'
  - name: cardHolderName
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{CardPayment} has card holder name {String}'
- concept: OrderLineItem
  type: EntityType
  description: LineItem in an Order.
  identify_by:
  - order
  - nr
  relationships:
  - name: order
    roles:
    - concept: Order
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLineItem} belongs to {Order}'
  - name: nr
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLineItem} has line item number {Integer}'
  - name: lineitem_extended_price
    description: Extended price for the line item.
    roles:
    - concept: Decimal
      name: lineitem_extended_price
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLineItem} has extended price {Decimal:lineitem_extended_price}'
  - name: lineitem_discount
    description: Discount factor applied to the line.
    roles:
    - concept: Decimal
      name: lineitem_discount
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLineItem} has discount factor {Decimal:lineitem_discount}'
  - name: net_revenue
    description: The net extended price of the order line after discount, but before
      tax.
    roles:
    - concept: Decimal
      name: net_revenue
    multiplicity: ManyToOne
    derived_by:
    - extended_price == OrderLineItem.lineitem_extended_price AND discount == OrderLineItem.lineitem_discount
      AND net_revenue == extended_price * (1 - discount)
    verbalizes:
    - '{OrderLineItem} has net revenue {Decimal:net_revenue}'
  - name: discounted_amount
    description: The amount paid after subtracting the discount from the extended
      price.
    roles:
    - concept: Amount
      name: discounted_amount
    multiplicity: ManyToOne
    derived_by:
    - discounted_amount == Amount(OrderLineItem.lineitem_extended_price - OrderLineItem.lineitem_discount)
    verbalizes:
    - '{OrderLineItem} has discounted amount {Amount:discounted_amount}'
- concept: Order
  type: EntityType
  description: Order in a Store.
  identify_by:
  - nr
  relationships:
  - name: nr
    roles:
    - concept: OrderNr
    multiplicity: OneToOne
    verbalizes:
    - '{Order} is identified by {OrderNr}'
  - name: orderDate
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{Order} has {Date}'
- concept: Transaction
  type: EntityType
  description: Transaction registered by a point-of-sale terminal.
  identify_by:
  - nr
  relationships:
  - name: nr
    roles:
    - concept: TransactionNr
    multiplicity: OneToOne
    verbalizes:
    - '{Transaction} is identified by {TransactionNr}'
  - name: registeredBy
    roles:
    - concept: Terminal
    multiplicity: ManyToOne
    verbalizes:
    - '{Transaction} is registered by {Terminal}'
  - name: returns
    roles:
    - concept: Item
    - concept: Amount
    multiplicity: ManyToOne
    verbalizes:
    - '{Transaction} refunds {Item} for {Amount}'
  - name: sales
    roles:
    - concept: Item
    - concept: Amount
    multiplicity: ManyToOne
    verbalizes:
    - '{Transaction} sells {Item} for {Amount}'
  - name: transactionTerminalStore
    roles:
    - concept: Terminal
    - concept: Store
    derived_by:
    - Transaction.registeredBy(Terminal) AND Terminal.deployedTo(Store)
    verbalizes:
    - '{Transaction} registered at {Terminal} deployed to {Store}'
  - name: storeNrViaBinaryChain
    roles:
    - concept: StoreNr
      name: store_nr
    multiplicity: ManyToOne
    derived_by:
    - store_nr == Transaction.registeredBy(Terminal).deployedTo.nr
    verbalizes:
    - '{Transaction} was registered at a terminal deployed to store {StoreNr:store_nr}'
  - name: storeNrViaTernaryChain
    roles:
    - concept: StoreNr
      name: store_nr
    multiplicity: ManyToOne
    derived_by:
    - store_nr == Transaction.transactionTerminalStore(Terminal).nr
    verbalizes:
    - '{Transaction} occurred at store {StoreNr:store_nr}'
  - name: transactionRegion
    roles:
    - concept: Region
    multiplicity: ManyToOne
    derived_by:
    - Transaction.registeredBy(Terminal) AND Terminal.deployedTo(Store) AND Store.storeToRegion(Region)
    verbalizes:
    - '{Transaction} occurred in {Region}'
  - name: transactionStoreManager
    roles:
    - concept: Employee
    multiplicity: ManyToOne
    derived_by:
    - Transaction.registeredBy(Terminal) AND Terminal.deployedTo(Store) AND Store.storeToManager(Employee)
    verbalizes:
    - '{Transaction} associated with store manager {Employee}'
- concept: Terminal
  type: EntityType
  description: A point-of-sale terminal for conducting retail transactions.
  identify_by:
  - id
  relationships:
  - name: id
    roles:
    - concept: RegisterId
    multiplicity: OneToOne
    verbalizes:
    - '{Terminal} is identified by {RegisterId}'
  - name: deployedTo
    roles:
    - concept: Store
    multiplicity: ManyToOne
    verbalizes:
    - '{Terminal} is deployed to {Store}'
- concept: Store
  type: EntityType
  description: Physical store that offers items for sale to the public.
  identify_by:
  - nr
  relationships:
  - name: nr
    roles:
    - concept: StoreNr
    multiplicity: OneToOne
    verbalizes:
    - '{Store} is identified by {StoreNr}'
  - name: storeToManager
    roles:
    - concept: Employee
    multiplicity: ManyToOne
    verbalizes:
    - '{Store} is managed by {Employee}'
  - name: storeToRegion
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{Store} belongs to {Region}'
  - name: avgReturns
    roles:
    - concept: Item
    - concept: Amount
      name: amt
    multiplicity: ManyToOne
    derived_by:
    - amt == AVG[Amount WHERE Transaction.registeredBy(Terminal) AND Transaction.returns(Transaction,
      Item, Amount) AND Terminal.deployedTo(Store) GROUP BY Item, Store]
    verbalizes:
    - '{Store} reports returns of {Item} for average {Amount:amt}'
  - name: avgReturnsWithMarkup
    roles:
    - concept: Item
    - concept: Amount
      name: amt
    multiplicity: ManyToOne
    derived_by:
    - amt == Amount(AVG[Amount WHERE Transaction.registeredBy(Terminal) AND Transaction.returns(Transaction,
      Item, Amount) AND Terminal.deployedTo(Store) GROUP BY Item, Store] * 1.1)
    verbalizes:
    - '{Store} reports returns of {Item} for 10%-marked-up average {Amount:amt}'
- concept: Region
  type: EntityType
  description: Region of a country.
  identify_by:
  - name
  relationships:
  - name: name
    roles:
    - concept: RegionName
    multiplicity: OneToOne
    verbalizes:
    - '{Region} is identified by {RegionName}'
- concept: Class
  type: EntityType
  description: Class of the Product.
  identify_by:
  - nr
  relationships:
  - name: nr
    roles:
    - concept: ClassNr
    multiplicity: OneToOne
    verbalizes:
    - '{Class} is identified by {ClassNr}'
  - name: classToCategory
    roles:
    - concept: Category
    multiplicity: ManyToOne
    verbalizes:
    - '{Class} is part of {Category}'
  - name: classToLabel
    roles:
    - concept: ClassLabel
    multiplicity: OneToOne
    verbalizes:
    - '{Class} has {ClassLabel}'
- concept: ClassLabel
  type: EntityType
  description: ClassLabel of the Product.
  identify_by:
  - name
  relationships:
  - name: name
    roles:
    - concept: ClassLabelName
    multiplicity: OneToOne
    verbalizes:
    - '{ClassLabel} is identified by {ClassLabelName}'
- concept: Category
  type: EntityType
  description: Category of the Product.
  identify_by:
  - name
  relationships:
  - name: name
    roles:
    - concept: CategoryName
    multiplicity: OneToOne
    verbalizes:
    - '{Category} is identified by {CategoryName}'
- concept: Item
  type: EntityType
  description: An item for sale at a retailer.
  identify_by:
  - upc
  relationships:
  - name: upc
    roles:
    - concept: UniversalProductCode
    multiplicity: OneToOne
    verbalizes:
    - '{Item} is identified by {UniversalProductCode}'
  - name: description
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Item} has description {String}'
  - name: itemToClass
    roles:
    - concept: Class
    multiplicity: ManyToOne
    verbalizes:
    - '{Item} is grouped by {Class}'
  - name: weekly_sales
    roles:
    - concept: Store
    - concept: Integer
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{Item} sold at {Store} in week {Integer} for {Decimal}'
  - name: weekly_gross_sales
    roles:
    - concept: Store
    - concept: Integer
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{Item} sold at {Store} in week {Integer} for gross {Decimal}'
  - name: weekly_gross_returns
    roles:
    - concept: Store
    - concept: Integer
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{Item} returned at {Store} in week {Integer} for {Decimal}'
  - name: weekly_net_revenue
    roles:
    - concept: Store
    - concept: Integer
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{Item} sold at {Store} in week {Integer} for net {Decimal}'
  - name: item_store_sales
    roles:
    - concept: Store
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{Item} sold at {Store} for total {Decimal}'
- concept: Employee
  type: EntityType
  description: Employee of the company.
  identify_by:
  - nr
  relationships:
  - name: nr
    roles:
    - concept: EmployeeNr
    multiplicity: OneToOne
    verbalizes:
    - '{Employee} is identified by {EmployeeNr}'
  - name: reportsTo
    roles:
    - concept: Employee
      name: mgr
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} reports to {Employee:mgr}'
  - name: firstName
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} has first name {String}'
  - name: lastName
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} has last name {String}'
- concept: PermanentEmployee
  type: EntityType
  description: Employee with indefinite contract.
  extends:
  - Employee
  relationships:
  - name: salary
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{PermanentEmployee} has monthly salary {Integer}'
- concept: Contractor
  type: EntityType
  description: Employee with temporary contract.
  extends:
  - Employee
  relationships:
  - name: hourlyRate
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Contractor} is paid hourly {Integer}'
- concept: PaymentId
  type: ValueType
  description: Unique id for a Payment.
  extends:
  - Integer
- concept: OrderNr
  type: ValueType
  description: Unique id for an Order.
  extends:
  - Integer
- concept: RegionName
  type: ValueType
  description: Unique name for a Region.
  extends:
  - String
- concept: ClassLabelName
  type: ValueType
  description: Unique name for a ClassLabel.
  extends:
  - String
- concept: CategoryName
  type: ValueType
  description: Unique name for a Category.
  extends:
  - String
- concept: ClassNr
  type: ValueType
  description: Unique number generated for Class.
  extends:
  - Integer
- concept: UniversalProductCode
  type: ValueType
  description: 12-digit number used for tracking trade items.
  extends:
  - Integer
  requires:
  - 0 < UniversalProductCode AND UniversalProductCode <= 999999999999
- concept: TransactionNr
  type: ValueType
  description: Unique transaction number generated by a point-of-sale terminal.
  extends:
  - Integer
  requires:
  - TransactionNr > 0
- concept: StoreNr
  type: ValueType
  description: Unique identifier for a physical store.
  extends:
  - Integer
- concept: RegisterId
  type: ValueType
  description: Unique identifier for point-of-sale terminals (cash registers).
  extends:
  - Integer
  requires:
  - RegisterId > 0
- concept: EmployeeNr
  type: ValueType
  description: Unique company-assigned employee number.
  extends:
  - Integer
  requires:
  - EmployeeNr > 0
- concept: Amount
  type: ValueType
  description: Amount of money exchanged in return for some item(s).
  extends:
  - Decimal
ontology_mappings:
- name: retail_refactored_mapping
  semantic_model:
    version: 0.2.0.dev0
    name: Retail refactored semantic model
    datasets:
    - name: EMPLOYEES
      source: DB.SCHEMA.EMPLOYEES
      fields:
      - name: empNr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: empNr
        datatype: Integer
      - name: lastName
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: lastName
        datatype: String
      - name: firstName
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: firstName
        datatype: String
      - name: mgr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: mgr
        datatype: Integer
      - name: addr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: addr
      - name: city
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: city
      - name: state
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: state
      - name: zip
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: zip
    - name: CONTRACTORS
      source: DB.SCHEMA.CONTRACTORS
      fields:
