    - object_mapping:
        referent_mappings:
        - relationship: id
          expression: ROUTE.id
      children:
      - relationship: distance
        object_mapping:
          concept: Distance
          expression: ROUTE.distance
      - relationship: lies_in
        object_mapping:
          concept: DistanceGroup
          expression: ROUTE.dist_grp
      - relationship: route_name
        object_mapping:
          concept: String
          expression: ROUTE.name
      - relationship: destination
        object_mapping:
          concept: Airport
          referent_mappings:
          - relationship: code
            expression: ROUTE.dest_airport_code
      - relationship: departure
        object_mapping:
          concept: Airport
          referent_mappings:
          - relationship: code
            expression: ROUTE.orig_airport_code
