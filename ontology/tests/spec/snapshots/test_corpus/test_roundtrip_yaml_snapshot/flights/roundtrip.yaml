version: 0.2.0.dev0
name: Flights
description: Ontology of flights into and out of airports.
requires:
- COUNT[Airport] > 0
- COUNT[Carrier] > 0
ontology:
- concept: Route
  type: EntityType
  identify_by:
  - id
  relationships:
  - name: average_departure_delay
    roles:
    - concept: Delay
    multiplicity: ManyToOne
    derived_by:
    - Delay == AVG[Flight.departure_delay WHERE Flight.route(Route) GROUP BY Route]
    verbalizes:
    - '{Route} has average- departure {Delay}'
  - name: average_arrival_delay
    roles:
    - concept: Delay
    multiplicity: ManyToOne
    derived_by:
    - Delay == AVG[Flight.arrival_delay WHERE Flight.route(Route) GROUP BY Route]
    verbalizes:
    - '{Route} has average- arrival {Delay}'
  - name: distance
    roles:
    - concept: Distance
    multiplicity: ManyToOne
    verbalizes:
    - '{Route} spans {Distance}'
  - name: lies_in
    roles:
    - concept: DistanceGroup
    multiplicity: ManyToOne
    verbalizes:
    - '{Route} has {DistanceGroup}'
  - name: id
    roles:
    - concept: RouteId
    multiplicity: OneToOne
    verbalizes:
    - '{Route} is identified by {RouteId}'
  - name: route_name
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Route} has name- {String}'
  - name: destination
    roles:
    - concept: Airport
    multiplicity: ManyToOne
    requires:
    - NOT Route.departure(Airport)
    verbalizes:
    - '{Route} connects to destination- {Airport}'
  - name: departure
    roles:
    - concept: Airport
    multiplicity: ManyToOne
    requires:
    - NOT Route.destination(Airport)
    verbalizes:
    - '{Route} connects to departure- {Airport}'
- concept: RouteId
  type: ValueType
  description: A unique identifier for a route between two airports. Constructed by
    concatenating the IATA codes of the departure and destination airports (e.g.,
    'ATL -> DCA')
  extends:
  - String
- concept: Carrier
  type: EntityType
  identify_by:
  - code
  relationships:
  - name: code
    roles:
    - concept: CarrierCode
    multiplicity: OneToOne
    verbalizes:
    - '{Carrier} uses {CarrierCode}'
  - name: name
    roles:
    - concept: CarrierName
    multiplicity: ManyToOne
    verbalizes:
    - '{Carrier} has {CarrierName}'
- concept: CarrierName
  type: ValueType
  extends:
  - String
- concept: CarrierCode
  type: ValueType
  description: The two-letter IATA code for the airline carrier.
  extends:
  - String
- concept: Flight
  type: EntityType
  identify_by:
  - id
  relationships:
  - name: departure_delay
    roles:
    - concept: Delay
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} has departure- {Delay}'
  - name: number
    roles:
    - concept: FlightNr
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} has {FlightNr}'
  - name: scheduled_departure
    roles:
    - concept: DateTime
    multiplicity: ManyToOne
    requires:
    - Flight.scheduled_departure < Flight.scheduled_arrival
    verbalizes:
    - '{Flight} is scheduled to depart at {DateTime}'
  - name: arrival_delay
    roles:
    - concept: Delay
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} has arrival- {Delay}'
  - name: canceled
    verbalizes:
    - '{Flight} was canceled'
  - name: canceled_due_to
    roles:
    - concept: CancelationReason
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} was canceled due to {CancelationReason}'
  - name: distance
    roles:
    - concept: Distance
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} spans actual- {Distance}'
  - name: id
    roles:
    - concept: FlightId
    multiplicity: OneToOne
    verbalizes:
    - '{Flight} is identified by {FlightId}'
  - name: scheduled_arrival
    roles:
    - concept: DateTime
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} is scheduled to arrive at {DateTime}'
  - name: registers_longitude_series
    roles:
    - concept: DateTime
    - concept: DegreesLongitude
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} at {DateTime} registers {DegreesLongitude}'
  - name: registers_latitude_series
    roles:
    - concept: DateTime
    - concept: DegreesLatitude
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} at {DateTime} registers {DegreesLatitude}'
  - name: date
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} is scheduled to depart on {Date}'
  - name: departs_at
    roles:
    - concept: DateTime
    multiplicity: ManyToOne
    requires:
    - Flight.departs_at < Flight.arrives_at
    verbalizes:
    - '{Flight} departs at {DateTime}'
  - name: diverted
    verbalizes:
    - '{Flight} was diverted'
  - name: arrives_at
    roles:
    - concept: DateTime
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} arrives at {DateTime}'
  - name: route
    roles:
    - concept: Route
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} traverses {Route}'
  - name: aircraft
    roles:
    - concept: Aircraft
    multiplicity: ManyToOne
    requires:
    - Flight.operated_by(Aircraft.carrier)
    verbalizes:
    - '{Flight} uses {Aircraft}'
  - name: operated_by
    roles:
    - concept: Carrier
    multiplicity: ManyToOne
    verbalizes:
    - '{Flight} is operated by {Carrier}'
- concept: FlightId
  type: ValueType
  description: A unique identifier for an instance of a flight
  extends:
  - String
- concept: FlightNr
  type: ValueType
  description: The IATA flight number, which is typically a combination of the airline's
    IATA code and a numeric code (e.g., 'AA1234').
  extends:
  - String
- concept: Market
  type: EntityType
  identify_by:
  - name
  relationships:
  - name: name
    roles:
    - concept: MarketName
    multiplicity: OneToOne
    verbalizes:
    - '{Market} is identified by {MarketName}'
- concept: MarketName
  type: ValueType
  extends:
  - String
- concept: Airport
  type: EntityType
  identify_by:
  - code
  requires:
  - Airport.latitude
  - Airport.longitude
  relationships:
  - name: city
    roles:
    - concept: City
    multiplicity: ManyToOne
    verbalizes:
    - '{Airport} is located in {City}'
  - name: serves
    roles:
    - concept: Market
    multiplicity: ManyToOne
    verbalizes:
    - '{Airport} serves {Market}'
  - name: average_departure_delay
    roles:
    - concept: Delay
    multiplicity: ManyToOne
    derived_by:
    - Delay == AVG[Flight.departure_delay WHERE Airport == Flight.route.departure
      GROUP BY Airport]
    verbalizes:
    - '{Airport} has average- departure {Delay}'
  - name: longitude
    roles:
    - concept: DegreesLongitude
    multiplicity: ManyToOne
    verbalizes:
    - '{Airport} centers at {DegreesLongitude}'
  - name: average_arrival_delay
    roles:
    - concept: Delay
    multiplicity: ManyToOne
    derived_by:
    - Delay == AVG[Flight.arrival_delay WHERE Airport == Flight.route.destination
      GROUP BY Airport]
    verbalizes:
    - '{Airport} has average- arrival {Delay}'
  - name: name
    roles:
    - concept: AirportName
    multiplicity: ManyToOne
    verbalizes:
    - '{Airport} has {AirportName}'
  - name: code
    roles:
    - concept: AirportCode
    multiplicity: OneToOne
    verbalizes:
    - '{Airport} has {AirportCode}'
  - name: latitude
    roles:
    - concept: DegreesLatitude
    multiplicity: ManyToOne
    verbalizes:
    - '{Airport} centers at {DegreesLatitude}'
- concept: AirportId
  type: ValueType
  description: Five digit number used as an alternate identifier for airports.
  extends:
  - String
- concept: AirportCode
  type: ValueType
  description: The three-letter IATA code for the airport.
  extends:
  - String
- concept: AirportName
  type: ValueType
  extends:
  - String
- concept: Aircraft
  type: EntityType
  identify_by:
  - tailnum
  relationships:
  - name: serial_number
    roles:
    - concept: SerialNr
    multiplicity: ManyToOne
    verbalizes:
    - '{Aircraft} has {SerialNr}'
  - name: name
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Aircraft} has name {String}'
  - name: number_of_seats
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Aircraft} has {Integer} seats'
  - name: tailnum
    roles:
    - concept: TailNr
    multiplicity: OneToOne
    verbalizes:
    - '{Aircraft} is identified by {TailNr}'
  - name: model
    roles:
    - concept: Model
    multiplicity: ManyToOne
    verbalizes:
    - '{Aircraft} has {Model}'
  - name: year_manufactured
    roles:
    - concept: Year
    multiplicity: ManyToOne
    verbalizes:
    - '{Aircraft} was manufactured in {Year}'
  - name: capacity
    roles:
    - concept: Capacity
    multiplicity: ManyToOne
    verbalizes:
    - '{Aircraft} has {Capacity}'
  - name: carrier
    roles:
    - concept: Carrier
    multiplicity: ManyToOne
    verbalizes:
    - '{Aircraft} is operated by {Carrier}'
- concept: Model
  type: EntityType
  identify_by:
  - name
  - manufacturer
  relationships:
  - name: name
    roles:
    - concept: ModelName
    multiplicity: ManyToOne
    verbalizes:
    - '{Model} has {ModelName}'
  - name: manufacturer
    roles:
    - concept: Manufacturer
    multiplicity: ManyToOne
    verbalizes:
    - '{Model} is manufactured by {Manufacturer}'
- concept: ModelName
  type: ValueType
  extends:
  - String
- concept: Manufacturer
  type: EntityType
  identify_by:
  - name
  relationships:
  - name: name
    roles:
    - concept: ManufacturerName
    multiplicity: OneToOne
    verbalizes:
    - '{Manufacturer} is identified by {ManufacturerName}'
- concept: ManufacturerName
  type: ValueType
  extends:
  - String
- concept: Runway
  type: EntityType
  identify_by:
  - designator
  - airport
  relationships:
  - name: airport
    roles:
    - concept: Airport
    multiplicity: ManyToOne
    verbalizes:
    - '{Runway} belongs to {Airport}'
  - name: designator
    roles:
    - concept: RunwayDesignator
    multiplicity: ManyToOne
    verbalizes:
    - '{Runway} uses {RunwayDesignator}'
  - name: length
    roles:
    - concept: RunwayLength
    multiplicity: ManyToOne
    verbalizes:
    - '{Runway} has {RunwayLength}'
  - name: geometry
    roles:
    - concept: RunwayGeometry
    multiplicity: ManyToOne
    verbalizes:
    - '{Runway} has {RunwayGeometry}'
- concept: City
  type: EntityType
  identify_by:
  - name
  - state
  relationships:
  - name: name
    roles:
    - concept: CityName
    multiplicity: ManyToOne
    verbalizes:
    - '{City} has {CityName}'
  - name: state
    roles:
    - concept: State
    multiplicity: ManyToOne
    verbalizes:
    - '{City} is located in {State}'
- concept: State
  type: EntityType
  identify_by:
  - code
  relationships:
  - name: code
    roles:
    - concept: StateCode
    multiplicity: OneToOne
    verbalizes:
    - '{State} is identified by {StateCode}'
  - name: name
    roles:
    - concept: StateName
    multiplicity: ManyToOne
    verbalizes:
    - '{State} has {StateName}'
- concept: CancelationReason
  type: EntityType
  description: A curated set of reasons that explain why a flight is canceled
  identify_by:
  - code
  relationships:
  - name: code
    roles:
    - concept: CancelationCode
    multiplicity: OneToOne
    verbalizes:
    - '{CancelationReason} is identified by {CancelationCode}'
  - name: description
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{CancelationReason} has description- {String}'
- concept: Year
  type: ValueType
  extends:
  - String
- concept: TailNr
  type: ValueType
  extends:
  - String
- concept: StateName
  type: ValueType
  extends:
  - String
- concept: StateCode
  type: ValueType
  extends:
  - String
- concept: SerialNr
  type: ValueType
  extends:
  - String
- concept: RunwayDesignator
  type: ValueType
  description: Used to distinguish runways within a given airport.
  extends:
  - String
- concept: DistanceGroup
  type: ValueType
  description: A number used to group distances of different lengths, where 1 groups
    the shortest and 10 the longest.
  extends:
  - Integer
  requires:
  - 1 <= DistanceGroup
  - DistanceGroup <= 10
- concept: CityName
  type: ValueType
  extends:
  - String
- concept: Polygon
  type: ValueType
  description: A polygon represented as a list of vertices, where each vertex is a
    pair of latitude and longitude coordinates.
  extends:
  - String
- concept: RunwayGeometry
  type: ValueType
  description: A polygon that models the shape of a runway.
  extends:
  - Polygon
- concept: DegreesLongitude
  type: ValueType
  extends:
  - Decimal
  requires:
  - DegreesLongitude <= 180
  - DegreesLongitude >= -180
- concept: DegreesLatitude
  type: ValueType
  extends:
  - Decimal
  requires:
  - DegreesLatitude <= 90
  - DegreesLatitude >= -90
- concept: CancelationCode
  type: ValueType
  description: The single character code that identifies the reason a flight is canceled
  extends:
  - String
  requires:
  - CancelationCode == 'A' OR CancelationCode == 'B' OR CancelationCode == 'C' OR
    CancelationCode == 'D'
- concept: NrMinutes
  type: ValueType
  description: Unit of measure for time in minutes
  extends:
  - Decimal
- concept: Delay
  type: ValueType
  extends:
  - NrMinutes
- concept: NrMiles
  type: ValueType
  description: Unit of measure for distance in miles
  extends:
  - Decimal
- concept: Distance
  type: ValueType
  extends:
  - NrMiles
- concept: NrPounds
  type: ValueType
  description: Unit of measure for weight in pounds
  extends:
  - Integer
- concept: Capacity
  type: ValueType
  description: The capacity of an aircraft, measured in pounds.
  extends:
  - NrPounds
- concept: NrFeet
  type: ValueType
  description: Unit of measure for distance in feet
  extends:
  - Decimal
- concept: RunwayLength
  type: ValueType
  description: The unit for measuring the lengths of runways in American airports.
  extends:
  - NrFeet
ontology_mappings:
- name: flights_mapping
  semantic_model:
    version: 0.2.0.dev0
    name: Flights semantic model
    datasets:
    - name: RUNWAY
      source: DATABASE.SCHEMA.RUNWAYS
      fields:
      - name: airport_code
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: airport_code
        datatype: String
      - name: length
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: length
        datatype: Decimal
      - name: shape
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: shape
        datatype: String
      - name: designator
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: designator
        datatype: String
    - name: AIRCRAFT
      source: DATABASE.SCHEMA.AIRCRAFT
      description: An airplane, helicopter, or other machine capable of flight
      fields:
      - name: serial_nr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: serial_nr
        datatype: String
      - name: name
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: name
        datatype: String
      - name: nr_seats
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: nr_seats
        datatype: Integer
      - name: tail_nr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: tail_nr
        datatype: String
      - name: carrier_code
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: carrier_code
        datatype: String
      - name: manufacturer
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: manufacturer
        datatype: String
      - name: model
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: model
        datatype: String
      - name: year
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: year
        datatype: String
      - name: capacity
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: capacity
        datatype: Integer
    - name: AIRPORT
      source: DATABASE.SCHEMA.AIRPORTS
      description: An airport that is identified by an IATA code.
      fields:
      - name: state_code
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: state_code
        datatype: String
      - name: market_nm
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: market_nm
        datatype: String
      - name: longitude
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: longitude
        datatype: Decimal
      - name: opened
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: opened
      - name: state_nm
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: state_nm
        datatype: String
      - name: city_nm
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: city_nm
        datatype: String
      - name: name
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: name
        datatype: String
      - name: code
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: code
        datatype: String
      - name: latitude
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: latitude
        datatype: Decimal
    - name: FLIGHT
      source: DATABASE.SCHEMA.FLIGHTS
      description: A commercial passenger flight.
      fields:
      - name: dep_delay
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: dep_delay
        datatype: Decimal
      - name: air_time
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: air_time
      - name: nr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: nr
        datatype: String
      - name: carrier_code
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: carrier_code
        datatype: String
      - name: duration
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: duration
      - name: scheduled_departure
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: scheduled_departure
        datatype: DateTime
      - name: arr_delay
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: arr_delay
        datatype: Decimal
      - name: cancelled
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: cancelled
        datatype: Boolean
      - name: cancel_code
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: cancel_code
        datatype: String
      - name: distance
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: distance
        datatype: Decimal
      - name: id
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: id
        datatype: String
      - name: scheduled_arrival
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: scheduled_arrival
        datatype: DateTime
      - name: wheels_on
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: wheels_on
      - name: date
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: date
        datatype: Date
      - name: wheels_off
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: wheels_off
      - name: scheduled_duration
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: scheduled_duration
      - name: tail_nr
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: tail_nr
        datatype: String
      - name: departure
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: departure
        datatype: DateTime
      - name: route_id
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: route_id
        datatype: String
      - name: diverted
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: diverted
        datatype: Boolean
      - name: arrival
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: arrival
        datatype: DateTime
    - name: CARRIER
      source: DATABASE.SCHEMA.CARRIERS
      description: An airline, such as Delta, United, or American.
      fields:
      - name: code
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: code
        datatype: String
      - name: name
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: name
        datatype: String
    - name: ROUTE
      source: DATABASE.SCHEMA.ROUTES
      description: Represents the existence of one or more flights between a pair
        of departure arrival airports.
      fields:
      - name: orig_airport_code
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: orig_airport_code
        datatype: String
      - name: dest_airport_code
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: dest_airport_code
        datatype: String
      - name: distance
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: distance
        datatype: Decimal
      - name: dist_grp
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: dist_grp
        datatype: Integer
      - name: id
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: id
        datatype: String
      - name: name
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: name
        datatype: String
  concept_mappings:
  - concept: Runway
    object_mappings:
    - referent_mappings:
      - relationship: designator
        expression: RUNWAY.designator
      - relationship: airport
        referent_mappings:
        - relationship: code
          expression: RUNWAY.airport_code
    link_mappings:
    - object_mapping:
        referent_mappings:
        - relationship: designator
          expression: RUNWAY.designator
        - relationship: airport
          referent_mappings:
          - relationship: code
            expression: RUNWAY.airport_code
      children:
      - relationship: length
        object_mapping:
          concept: RunwayLength
          expression: RUNWAY.length
      - relationship: geometry
        object_mapping:
          concept: RunwayGeometry
          expression: RUNWAY.shape
  - concept: Manufacturer
    object_mappings:
    - referent_mappings:
      - relationship: name
        expression: AIRCRAFT.manufacturer
  - concept: Model
    object_mappings:
    - referent_mappings:
      - relationship: name
        expression: AIRCRAFT.model
      - relationship: manufacturer
        referent_mappings:
        - relationship: name
          expression: AIRCRAFT.manufacturer
  - concept: Aircraft
    object_mappings:
    - referent_mappings:
      - relationship: tailnum
        expression: AIRCRAFT.tail_nr
    link_mappings:
    - object_mapping:
        referent_mappings:
        - relationship: tailnum
          expression: AIRCRAFT.tail_nr
      children:
      - relationship: serial_number
        object_mapping:
          concept: SerialNr
          expression: AIRCRAFT.serial_nr
      - relationship: name
        object_mapping:
          concept: String
          expression: AIRCRAFT.name
      - relationship: number_of_seats
        object_mapping:
          concept: Integer
          expression: AIRCRAFT.nr_seats
      - relationship: model
        object_mapping:
          concept: Model
          referent_mappings:
          - relationship: name
            expression: AIRCRAFT.model
          - relationship: manufacturer
            referent_mappings:
            - relationship: name
              expression: AIRCRAFT.manufacturer
      - relationship: year_manufactured
        object_mapping:
          concept: Year
          expression: AIRCRAFT.year
      - relationship: capacity
        object_mapping:
          concept: Capacity
          expression: AIRCRAFT.capacity
      - relationship: carrier
        object_mapping:
          concept: Carrier
          referent_mappings:
          - relationship: code
            expression: AIRCRAFT.carrier_code
  - concept: State
    object_mappings:
    - referent_mappings:
      - relationship: code
        expression: AIRPORT.state_code
    link_mappings:
    - object_mapping:
        referent_mappings:
        - relationship: code
          expression: AIRPORT.state_code
      children:
      - relationship: name
        object_mapping:
          concept: StateName
          expression: AIRPORT.state_nm
  - concept: City
    object_mappings:
    - referent_mappings:
      - relationship: name
        expression: AIRPORT.city_nm
      - relationship: state
        referent_mappings:
        - relationship: code
          expression: AIRPORT.state_code
  - concept: Market
    object_mappings:
    - referent_mappings:
      - relationship: name
        expression: AIRPORT.market_nm
  - concept: Airport
    object_mappings:
    - referent_mappings:
      - relationship: code
        expression: AIRPORT.code
    link_mappings:
    - object_mapping:
        referent_mappings:
        - relationship: code
          expression: AIRPORT.code
      children:
      - relationship: city
        object_mapping:
          concept: City
          referent_mappings:
          - relationship: name
            expression: AIRPORT.city_nm
          - relationship: state
            referent_mappings:
            - relationship: code
              expression: AIRPORT.state_code
      - relationship: serves
        object_mapping:
          concept: Market
          referent_mappings:
          - relationship: name
            expression: AIRPORT.market_nm
      - relationship: longitude
        object_mapping:
          concept: DegreesLongitude
          expression: AIRPORT.longitude
      - relationship: name
        object_mapping:
          concept: AirportName
          expression: AIRPORT.name
      - relationship: latitude
        object_mapping:
          concept: DegreesLatitude
          expression: AIRPORT.latitude
  - concept: Flight
    object_mappings:
    - referent_mappings:
      - relationship: id
        expression: FLIGHT.id
    link_mappings:
    - relationship: diverted
      object_mapping:
        referent_mappings:
        - relationship: id
          expression: FLIGHT.id WHERE ( FLIGHT.diverted == TRUE )
    - relationship: canceled
      object_mapping:
        referent_mappings:
        - relationship: id
          expression: FLIGHT.id WHERE ( FLIGHT.cancelled == TRUE )
    - object_mapping:
        referent_mappings:
        - relationship: id
          expression: FLIGHT.id
      children:
      - relationship: arrival_delay
        object_mapping:
          concept: Delay
          expression: FLIGHT.arr_delay
      - relationship: departure_delay
        object_mapping:
          concept: Delay
          expression: FLIGHT.dep_delay
      - relationship: number
        object_mapping:
          concept: FlightNr
          expression: FLIGHT.nr
      - relationship: scheduled_departure
        object_mapping:
          concept: DateTime
          expression: FLIGHT.scheduled_departure
      - relationship: canceled_due_to
        object_mapping:
          concept: CancelationReason
          referent_mappings:
          - relationship: code
            expression: FLIGHT.cancel_code
      - relationship: distance
        object_mapping:
          concept: Distance
          expression: FLIGHT.distance
      - relationship: scheduled_arrival
        object_mapping:
          concept: DateTime
          expression: FLIGHT.scheduled_arrival
      - relationship: date
        object_mapping:
          concept: Date
          expression: FLIGHT.date
      - relationship: departs_at
        object_mapping:
          concept: DateTime
          expression: FLIGHT.departure
      - relationship: arrives_at
        object_mapping:
          concept: DateTime
          expression: FLIGHT.arrival
      - relationship: route
        object_mapping:
          concept: Route
          referent_mappings:
          - relationship: id
            expression: FLIGHT.route_id
      - relationship: aircraft
        object_mapping:
          concept: Aircraft
          referent_mappings:
          - relationship: tailnum
            expression: FLIGHT.tail_nr
      - relationship: operated_by
        object_mapping:
          concept: Carrier
          referent_mappings:
          - relationship: code
            expression: FLIGHT.carrier_code
  - concept: Carrier
    object_mappings:
    - referent_mappings:
      - relationship: code
        expression: CARRIER.code
    link_mappings:
    - object_mapping:
        referent_mappings:
        - relationship: code
          expression: CARRIER.code
      children:
