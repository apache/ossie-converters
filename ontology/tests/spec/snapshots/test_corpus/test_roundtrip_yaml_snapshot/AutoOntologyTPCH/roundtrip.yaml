            expression: S_NAME
        description: The business name of the supplier.
        datatype: String
      - name: phone_number
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: S_PHONE
        description: The contact telephone number of the supplier.
        datatype: String
      - name: account_balance
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: S_ACCTBAL
        description: The supplier's account balance, which may be positive or negative.
        datatype: Decimal
      - name: comment
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: S_COMMENT
        description: A free-text comment or remark associated with the supplier.
        datatype: String
      - name: address
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: S_ADDRESS
        description: The street or physical address of the supplier.
        datatype: String
      - name: supplier_key
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: S_SUPPKEY
        description: The unique numeric identifier (primary key) assigned to each supplier.
        datatype: Integer
      - name: s_nationkey
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: S_NATIONKEY
        datatype: Integer
