          - dialect: ANSI_SQL
            expression: P_PARTKEY
        description: The unique numeric identifier assigned to each part in the catalog.
        datatype: Integer
    - name: part_supplier
      source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.PARTSUPP
      primary_key:
