            expression: R_COMMENT
        description: A free-text comment or note associated with the region.
        datatype: String
      - name: region_key
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: R_REGIONKEY
        description: The unique numeric identifier assigned to each region.
        datatype: Integer
      - name: region_name
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: R_NAME
        description: The name of the geographic region, such as AFRICA, AMERICA, or EUROPE.
        datatype: String
    - name: supplier
      source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.SUPPLIER
      primary_key:
