version: 0.2.0.dev0
name: tpch_ontology
description: Business concepts of the tpch semantic model
ontology:
- concept: Supplier
  type: EntityType
  description: A business entity that provides goods or services, including its contact information and account standing.
  identify_by:
  - supplier_key
  relationships:
  - name: supplier_name
    description: The business name of the supplier.
    roles:
    - concept: String
    verbalizes:
    - '{Supplier} has supplier name {String}'
    multiplicity: ManyToOne
  - name: phone_number
    description: The contact telephone number of the supplier.
    roles:
    - concept: String
    verbalizes:
    - '{Supplier} has phone number {String}'
    multiplicity: ManyToOne
  - name: account_balance
    description: The supplier's account balance, which may be positive or negative.
    roles:
    - concept: Decimal
    verbalizes:
    - '{Supplier} has account balance {Decimal}'
    multiplicity: ManyToOne
  - name: comment
    description: A free-text comment or remark associated with the supplier.
    roles:
    - concept: String
    verbalizes:
    - '{Supplier} has comment {String}'
    multiplicity: ManyToOne
  - name: address
    description: The street or physical address of the supplier.
    roles:
    - concept: String
    verbalizes:
    - '{Supplier} has address {String}'
    multiplicity: ManyToOne
  - name: supplier_key
    description: The unique numeric identifier (primary key) assigned to each supplier.
    roles:
    - concept: Integer
    verbalizes:
    - '{Supplier} is identified by supplier key {Integer}'
    multiplicity: OneToOne
  - name: nation
    roles:
    - concept: Nation
    verbalizes:
    - '{Supplier} has {Nation}'
    multiplicity: ManyToOne
- concept: Region
  type: EntityType
  description: A geographic region used to group nations.
  identify_by:
  - region_key
  relationships:
  - name: comment
    description: A free-text comment or note associated with the region.
    roles:
    - concept: String
    verbalizes:
    - '{Region} has comment {String}'
    multiplicity: ManyToOne
  - name: region_key
    description: The unique numeric identifier assigned to each region.
    roles:
    - concept: Integer
    verbalizes:
    - '{Region} is identified by region key {Integer}'
    multiplicity: OneToOne
  - name: region_name
    description: The name of the geographic region, such as AFRICA, AMERICA, or EUROPE.
    roles:
    - concept: String
    verbalizes:
    - '{Region} has region name {String}'
    multiplicity: ManyToOne
- concept: PartSupplier
  type: EntityType
  description: Represents the supply relationship between a part and a supplier, including availability, cost, and notes.
  identify_by:
  - part
  - supplier
  relationships:
  - name: available_quantity
    description: The quantity of the part currently available in stock from the associated supplier.
    roles:
    - concept: Integer
    verbalizes:
    - '{PartSupplier} has available quantity {Integer}'
    multiplicity: ManyToOne
  - name: comment
    description: A free-text comment or note associated with the part-supplier relationship.
    roles:
    - concept: String
    verbalizes:
    - '{PartSupplier} has comment {String}'
    multiplicity: ManyToOne
  - name: supply_cost
    description: The per-unit cost the supplier charges to provide the associated part.
    roles:
    - concept: Decimal
    verbalizes:
    - '{PartSupplier} has supply cost {Decimal}'
    multiplicity: ManyToOne
  - name: part
    roles:
    - concept: Part
    verbalizes:
    - '{PartSupplier} has {Part}'
    multiplicity: ManyToOne
  - name: supplier
    roles:
    - concept: Supplier
    verbalizes:
    - '{PartSupplier} has {Supplier}'
    multiplicity: ManyToOne
- concept: Part
  type: EntityType
  description: A part in the product catalog, including its identification, classification, packaging, and pricing details.
  identify_by:
  - part_key
  relationships:
  - name: container
    description: The type and dimension of the container in which the part is packaged.
    roles:
    - concept: String
    verbalizes:
    - '{Part} has container {String}'
    multiplicity: ManyToOne
  - name: size
    description: The numeric size measurement of the part.
    roles:
    - concept: Integer
    verbalizes:
    - '{Part} has size {Integer}'
    multiplicity: ManyToOne
  - name: part_type
    description: The classification of the part describing its grade, finish, and material composition.
    roles:
    - concept: String
    verbalizes:
    - '{Part} has part type {String}'
    multiplicity: ManyToOne
  - name: part_name
    description: The descriptive name of the part, typically composed of color and material descriptor words.
    roles:
    - concept: String
    verbalizes:
    - '{Part} has part name {String}'
    multiplicity: ManyToOne
  - name: manufacturer
    description: The manufacturer that produces the part, identified by a standardized manufacturer code.
    roles:
    - concept: String
    verbalizes:
    - '{Part} has manufacturer {String}'
    multiplicity: ManyToOne
  - name: retail_price
    description: The retail selling price of the part.
    roles:
    - concept: Decimal
    verbalizes:
    - '{Part} has retail price {Decimal}'
    multiplicity: ManyToOne
  - name: brand
    description: The brand under which the part is marketed, identified by a standardized brand code.
    roles:
    - concept: String
    verbalizes:
    - '{Part} has brand {String}'
    multiplicity: ManyToOne
  - name: comment
    description: A free-text comment or note associated with the part.
    roles:
    - concept: String
    verbalizes:
    - '{Part} has comment {String}'
    multiplicity: ManyToOne
  - name: part_key
    description: The unique numeric identifier assigned to each part in the catalog.
    roles:
    - concept: Integer
    verbalizes:
    - '{Part} is identified by part key {Integer}'
    multiplicity: OneToOne
- concept: Order
  type: EntityType
  description: A customer order capturing its status, total value, priority, and processing details.
  identify_by:
  - order_key
  relationships:
  - name: clerk
    description: The identifier of the clerk who processed the order.
    roles:
    - concept: String
    verbalizes:
    - '{Order} has clerk {String}'
    multiplicity: ManyToOne
  - name: comment
    description: A free-text comment or note associated with the order.
    roles:
    - concept: String
    verbalizes:
    - '{Order} has comment {String}'
    multiplicity: ManyToOne
  - name: order_key
    description: The unique numeric identifier assigned to each customer order.
    roles:
    - concept: Integer
    verbalizes:
    - '{Order} is identified by order key {Integer}'
    multiplicity: OneToOne
  - name: total_price
    description: The total monetary value of the order, including all line items.
    roles:
    - concept: Decimal
    verbalizes:
    - '{Order} has total price {Decimal}'
    multiplicity: ManyToOne
  - name: ship_priority
    description: A numeric code indicating the shipping priority of the order.
    roles:
    - concept: Integer
    verbalizes:
    - '{Order} has ship priority {Integer}'
    multiplicity: ManyToOne
  - name: order_status
    description: A single-character code indicating the fulfillment status of the order, such as F (fulfilled), O (open), or P (pending).
    roles:
    - concept: String
    verbalizes:
    - '{Order} has order status {String}'
    multiplicity: ManyToOne
  - name: order_priority
    description: The priority level assigned to the order, ranging from 1-URGENT to 5-LOW.
    roles:
    - concept: String
    verbalizes:
    - '{Order} has order priority {String}'
    multiplicity: ManyToOne
  - name: order_date
    description: "The date on which the order was placed. \u2014 format: YYYY-MM-DD"
    roles:
    - concept: Date
    verbalizes:
    - '{Order} has order date {Date}'
    multiplicity: ManyToOne
  - name: customer
    roles:
    - concept: Customer
    verbalizes:
    - '{Order} has {Customer}'
    multiplicity: ManyToOne
- concept: OrderLineItem
  type: EntityType
  description: An individual line within an order representing a specific product quantity, pricing, shipping, and fulfillment details.
  identify_by:
  - order
  - line_number
  relationships:
  - name: receipt_date
    description: "The date on which the line item was received by the customer. \u2014 format: YYYY-MM-DD"
    roles:
    - concept: Date
    verbalizes:
    - '{OrderLineItem} has receipt date {Date}'
    multiplicity: ManyToOne
  - name: ship_mode
    description: The transportation mode used to ship the line item, such as air, truck, rail, or ship.
    roles:
    - concept: String
    verbalizes:
    - '{OrderLineItem} has ship mode {String}'
    multiplicity: ManyToOne
  - name: tax_rate
    description: The tax rate applied to the line item, expressed as a decimal fraction.
    roles:
    - concept: Decimal
    verbalizes:
    - '{OrderLineItem} has tax rate {Decimal}'
    multiplicity: ManyToOne
  - name: extended_price
    description: The total gross price for the line item before discount and tax, calculated as quantity times unit price.
    roles:
    - concept: Decimal
    verbalizes:
    - '{OrderLineItem} has extended price {Decimal}'
    multiplicity: ManyToOne
  - name: line_number
    description: The sequential line item number identifying each individual line within an order.
    roles:
    - concept: Integer
    verbalizes:
    - '{OrderLineItem} has line number {Integer}'
    multiplicity: ManyToOne
  - name: discount_rate
    description: The discount rate applied to the line item, expressed as a decimal fraction of the extended price.
    roles:
    - concept: Decimal
    verbalizes:
    - '{OrderLineItem} has discount rate {Decimal}'
    multiplicity: ManyToOne
  - name: quantity
    description: The number of units of the product ordered on this line item.
    roles:
    - concept: Decimal
    verbalizes:
    - '{OrderLineItem} has quantity {Decimal}'
    multiplicity: ManyToOne
  - name: line_status
    description: A single-character code indicating whether the line item is fulfilled/filled (F) or open (O).
    roles:
    - concept: String
    verbalizes:
    - '{OrderLineItem} has line status {String}'
    multiplicity: ManyToOne
  - name: commit_date
    description: "The committed delivery date promised for the line item. \u2014 format: YYYY-MM-DD"
    roles:
    - concept: Date
    verbalizes:
    - '{OrderLineItem} has commit date {Date}'
    multiplicity: ManyToOne
  - name: return_flag
    description: A single-character code indicating the return status of the line item, such as returned, accepted, or not returned.
    roles:
    - concept: String
    verbalizes:
    - '{OrderLineItem} has return flag {String}'
    multiplicity: ManyToOne
  - name: shipping_instructions
    description: The shipping handling instruction for the line item, such as deliver in person or collect COD.
    roles:
    - concept: String
    verbalizes:
    - '{OrderLineItem} has shipping instructions {String}'
    multiplicity: ManyToOne
  - name: comment
    description: A free-text comment or note associated with the line item.
    roles:
    - concept: String
    verbalizes:
    - '{OrderLineItem} has comment {String}'
    multiplicity: ManyToOne
  - name: ship_date
    description: "The date on which the line item was shipped. \u2014 format: YYYY-MM-DD"
    roles:
    - concept: Date
    verbalizes:
    - '{OrderLineItem} has ship date {Date}'
    multiplicity: ManyToOne
  - name: missing_line_status
    description: Identifies order line items whose line status is unset. Line status captures the fulfillment state of an individual line within an order, so a NULL value marks a line item in an undefined state. Data consumers would use this to surface incomplete records or exclude unprocessed line items from status-based reporting.
    roles:
    - concept: Boolean
    verbalizes:
    - '{OrderLineItem} has missing line status {Boolean}'
    multiplicity: ManyToOne
  - name: missing_return_flag
    description: Identifies order line items where the return flag has not been set. For the Order Line Item term, the return flag typically indicates whether a line was returned by the customer. A NULL value signals incomplete fulfillment/return data, which a data consumer would apply when auditing data quality or isolating line items whose return status is unknown.
    roles:
    - concept: Boolean
    verbalizes:
    - '{OrderLineItem} has missing return flag {Boolean}'
    multiplicity: ManyToOne
  - name: missing_shipping_instructions
    description: Flags order line items that have no shipping instructions recorded. Shipping instructions carry business meaning about how a line item should be handled during fulfillment. A data consumer would apply this filter to find line items needing default handling or to detect gaps in fulfillment setup.
    roles:
    - concept: Boolean
    verbalizes:
    - '{OrderLineItem} has missing shipping instructions {Boolean}'
    multiplicity: ManyToOne
  - name: part_supplier
    roles:
    - concept: PartSupplier
    verbalizes:
    - '{OrderLineItem} has {PartSupplier}'
    multiplicity: ManyToOne
  - name: order
    roles:
    - concept: Order
    verbalizes:
    - '{OrderLineItem} has {Order}'
    multiplicity: ManyToOne
  - name: part
    roles:
    - concept: Part
    verbalizes:
    - '{OrderLineItem} has {Part}'
    multiplicity: ManyToOne
  - name: supplier
    roles:
    - concept: Supplier
    verbalizes:
    - '{OrderLineItem} has {Supplier}'
    multiplicity: ManyToOne
- concept: Nation
  type: EntityType
  description: A country or nation entity with its identifier, name, and descriptive comment.
  identify_by:
  - nation_key
  relationships:
  - name: nation_name
    description: The official name of the nation.
    roles:
    - concept: String
    verbalizes:
    - '{Nation} has nation name {String}'
    multiplicity: ManyToOne
  - name: nation_key
    description: The unique numeric identifier assigned to each nation in the table.
    roles:
    - concept: Integer
    verbalizes:
    - '{Nation} is identified by nation key {Integer}'
    multiplicity: OneToOne
  - name: nation_comment
    description: A free-text comment or note associated with the nation.
    roles:
    - concept: String
    verbalizes:
    - '{Nation} has nation comment {String}'
    multiplicity: ManyToOne
  - name: region
    roles:
    - concept: Region
    verbalizes:
    - '{Nation} has {Region}'
    multiplicity: ManyToOne
- concept: Customer
  type: EntityType
  description: A customer entity including identity, contact information, account balance, and market segment classification.
  identify_by:
  - customer_key
  relationships:
  - name: address
    description: The customer's street address as a free-text field.
    roles:
    - concept: String
    verbalizes:
    - '{Customer} has address {String}'
    multiplicity: ManyToOne
  - name: market_segment
    description: The market segment classification to which the customer belongs, such as FURNITURE, MACHINERY, or BUILDING.
    roles:
    - concept: String
    verbalizes:
    - '{Customer} has market segment {String}'
    multiplicity: ManyToOne
  - name: customer_name
    description: The customer's name, formatted as a standardized label combining the 'Customer#' prefix with a zero-padded customer number.
    roles:
    - concept: String
    verbalizes:
    - '{Customer} has customer name {String}'
    multiplicity: ManyToOne
  - name: phone_number
    description: The customer's telephone number stored in a formatted string with country and area code segments.
    roles:
    - concept: String
    verbalizes:
    - '{Customer} has phone number {String}'
    multiplicity: ManyToOne
  - name: customer_key
    description: The unique numeric identifier assigned to each customer, serving as the primary key for the customer record.
    roles:
    - concept: Integer
    verbalizes:
    - '{Customer} is identified by customer key {Integer}'
    multiplicity: OneToOne
  - name: comment
    description: A free-text comment field containing additional descriptive notes about the customer.
    roles:
    - concept: String
    verbalizes:
    - '{Customer} has comment {String}'
    multiplicity: ManyToOne
  - name: account_balance
    description: The customer's account balance expressed as a monetary amount.
    roles:
    - concept: Decimal
    verbalizes:
    - '{Customer} has account balance {Decimal}'
    multiplicity: ManyToOne
  - name: nation
    roles:
    - concept: Nation
    verbalizes:
    - '{Customer} has {Nation}'
    multiplicity: ManyToOne
ontology_mappings:
- name: tpch_mapping
  description: Maps the tpch_ontology onto the tpch semantic model
  semantic_model:
    version: 0.2.0.dev0
    name: tpch
    datasets:
    - name: customer
      source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.CUSTOMER
      primary_key:
      - customer_key
      description: A customer entity including identity, contact information, account balance, and market segment classification.
      fields:
      - name: address
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: C_ADDRESS
        description: The customer's street address as a free-text field.
        datatype: String
      - name: market_segment
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: C_MKTSEGMENT
        description: The market segment classification to which the customer belongs, such as FURNITURE, MACHINERY, or BUILDING.
        datatype: String
      - name: customer_name
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: C_NAME
        description: The customer's name, formatted as a standardized label combining the 'Customer#' prefix with a zero-padded customer number.
        datatype: String
      - name: phone_number
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: C_PHONE
        description: The customer's telephone number stored in a formatted string with country and area code segments.
        datatype: String
      - name: customer_key
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: C_CUSTKEY
        description: The unique numeric identifier assigned to each customer, serving as the primary key for the customer record.
        datatype: Integer
      - name: comment
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: C_COMMENT
        description: A free-text comment field containing additional descriptive notes about the customer.
        datatype: String
      - name: account_balance
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: C_ACCTBAL
        description: The customer's account balance expressed as a monetary amount.
        datatype: Decimal
      - name: c_nationkey
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: C_NATIONKEY
        datatype: Integer
    - name: nation
      source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.NATION
      primary_key:
      - nation_key
      description: A country or nation entity with its identifier, name, and descriptive comment.
      fields:
      - name: nation_name
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: N_NAME
        description: The official name of the nation.
        datatype: String
      - name: nation_key
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: N_NATIONKEY
        description: The unique numeric identifier assigned to each nation in the table.
        datatype: Integer
      - name: nation_comment
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: N_COMMENT
        description: A free-text comment or note associated with the nation.
        datatype: String
      - name: n_regionkey
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: N_REGIONKEY
        datatype: Integer
    - name: order_line_item
      source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.LINEITEM
      primary_key:
      - l_orderkey
      - line_number
      description: An individual line within an order representing a specific product quantity, pricing, shipping, and fulfillment details.
      fields:
      - name: receipt_date
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_RECEIPTDATE
        description: "The date on which the line item was received by the customer. \u2014 format: YYYY-MM-DD"
        datatype: Date
      - name: ship_mode
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_SHIPMODE
        description: The transportation mode used to ship the line item, such as air, truck, rail, or ship.
        datatype: String
      - name: tax_rate
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_TAX
        description: The tax rate applied to the line item, expressed as a decimal fraction.
        datatype: Decimal
      - name: extended_price
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_EXTENDEDPRICE
        description: The total gross price for the line item before discount and tax, calculated as quantity times unit price.
        datatype: Decimal
      - name: line_number
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_LINENUMBER
        description: The sequential line item number identifying each individual line within an order.
        datatype: Integer
      - name: discount_rate
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_DISCOUNT
        description: The discount rate applied to the line item, expressed as a decimal fraction of the extended price.
        datatype: Decimal
      - name: quantity
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_QUANTITY
        description: The number of units of the product ordered on this line item.
        datatype: Decimal
      - name: line_status
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_LINESTATUS
        description: A single-character code indicating whether the line item is fulfilled/filled (F) or open (O).
        datatype: String
      - name: commit_date
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_COMMITDATE
        description: "The committed delivery date promised for the line item. \u2014 format: YYYY-MM-DD"
        datatype: Date
      - name: return_flag
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_RETURNFLAG
        description: A single-character code indicating the return status of the line item, such as returned, accepted, or not returned.
        datatype: String
      - name: shipping_instructions
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_SHIPINSTRUCT
        description: The shipping handling instruction for the line item, such as deliver in person or collect COD.
        datatype: String
      - name: comment
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_COMMENT
        description: A free-text comment or note associated with the line item.
        datatype: String
      - name: ship_date
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_SHIPDATE
        description: "The date on which the line item was shipped. \u2014 format: YYYY-MM-DD"
        datatype: Date
      - name: missing_line_status
        expression:
          dialects:
          - dialect: SNOWFLAKE
            expression: '"L_LINESTATUS" IS NULL'
        description: Identifies order line items whose line status is unset. Line status captures the fulfillment state of an individual line within an order, so a NULL value marks a line item in an undefined state. Data consumers would use this to surface incomplete records or exclude unprocessed line items from status-based reporting.
        datatype: Boolean
      - name: missing_return_flag
        expression:
          dialects:
          - dialect: SNOWFLAKE
            expression: '"L_RETURNFLAG" IS NULL'
        description: Identifies order line items where the return flag has not been set. For the Order Line Item term, the return flag typically indicates whether a line was returned by the customer. A NULL value signals incomplete fulfillment/return data, which a data consumer would apply when auditing data quality or isolating line items whose return status is unknown.
        datatype: Boolean
      - name: missing_shipping_instructions
        expression:
          dialects:
          - dialect: SNOWFLAKE
            expression: '"L_SHIPINSTRUCT" IS NULL'
        description: Flags order line items that have no shipping instructions recorded. Shipping instructions carry business meaning about how a line item should be handled during fulfillment. A data consumer would apply this filter to find line items needing default handling or to detect gaps in fulfillment setup.
        datatype: Boolean
      - name: l_orderkey
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_ORDERKEY
        datatype: Integer
      - name: l_partkey
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_PARTKEY
        datatype: Integer
      - name: l_suppkey
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: L_SUPPKEY
        datatype: Integer
    - name: order
      source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.ORDERS
      primary_key:
      - order_key
      description: A customer order capturing its status, total value, priority, and processing details.
      fields:
      - name: clerk
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: O_CLERK
        description: The identifier of the clerk who processed the order.
        datatype: String
      - name: comment
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: O_COMMENT
        description: A free-text comment or note associated with the order.
        datatype: String
      - name: order_key
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: O_ORDERKEY
        description: The unique numeric identifier assigned to each customer order.
        datatype: Integer
      - name: total_price
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: O_TOTALPRICE
        description: The total monetary value of the order, including all line items.
        datatype: Decimal
      - name: ship_priority
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: O_SHIPPRIORITY
        description: A numeric code indicating the shipping priority of the order.
        datatype: Integer
      - name: order_status
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: O_ORDERSTATUS
        description: A single-character code indicating the fulfillment status of the order, such as F (fulfilled), O (open), or P (pending).
        datatype: String
      - name: order_priority
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: O_ORDERPRIORITY
        description: The priority level assigned to the order, ranging from 1-URGENT to 5-LOW.
        datatype: String
      - name: order_date
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: O_ORDERDATE
        description: "The date on which the order was placed. \u2014 format: YYYY-MM-DD"
        datatype: Date
      - name: o_custkey
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: O_CUSTKEY
        datatype: Integer
    - name: part
      source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.PART
      primary_key:
