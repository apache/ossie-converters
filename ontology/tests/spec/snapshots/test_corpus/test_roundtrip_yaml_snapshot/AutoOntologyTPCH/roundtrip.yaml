        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: PS_AVAILQTY
        description: The quantity of the part currently available in stock from the associated supplier.
        datatype: Integer
      - name: comment
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: PS_COMMENT
        description: A free-text comment or note associated with the part-supplier relationship.
        datatype: String
      - name: supply_cost
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: PS_SUPPLYCOST
        description: The per-unit cost the supplier charges to provide the associated part.
        datatype: Decimal
      - name: ps_partkey
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: PS_PARTKEY
        datatype: Integer
      - name: ps_suppkey
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: PS_SUPPKEY
        datatype: Integer
    - name: region
      source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.REGION
