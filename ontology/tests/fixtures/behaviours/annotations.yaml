# `annotations` at every level that accepts them.
#
# Derived from apache/ossie's examples/foaf_owl_import.yaml, with two additions
# that example lacks: a role annotation, and a nested value, because annotation
# values may be any JSON rather than only strings.
version: 0.2.0.dev0
name: foaf
prefixes:
  foaf: "http://xmlns.com/foaf/0.1/"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  owl: "http://www.w3.org/2002/07/owl#"
  dc: "http://purl.org/dc/elements/1.1/"
  vs: "http://www.w3.org/2003/06/sw-vocab-status/ns#"
annotations:
  dc:title: "Friend of a Friend (FOAF) vocabulary"
ontology:
  - concept: Person
    type: EntityType
    description: "A person."
    iri: foaf:Person
    annotations:
      rdfs:label: "Person"
      owl:equivalentClass: "http://schema.org/Person"
      vs:term_status: "stable"
    relationships:
      - name: name
        description: "A name for some thing."
        iri: foaf:name
        roles:
          - concept: String
        verbalizes: [ "{Person} has name {String}" ]
        multiplicity: ManyToOne
        annotations:
          rdfs:label: "name"
          rdfs:subPropertyOf: "rdfs:label"
          vs:term_status: "testing"
      - name: knows
        description: "A person known by this person."
        iri: foaf:knows
        roles:
          - concept: Person
            name: acquaintance
            annotations:
              rdfs:comment: "The person being known."
              source:
                vocabulary: foaf
                versions: [ "0.1", "0.99" ]
        verbalizes: [ "{Person} knows {Person:acquaintance}" ]
        annotations:
          rdfs:label: "knows"
          vs:term_status: "stable"
